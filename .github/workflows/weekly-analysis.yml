name: Refresh weekly forecasts
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * 1,9-12 *'
    - cron: '0 15,18,21 * 1,9-12 0'
    - cron: '0 23 * 1,9-12 1,3,4'
    - cron: '30 16 * 1,9-12 0'
permissions:
  contents: write
  pages: write
concurrency:
  group: weekly-forecasts
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/cache@v4
        with:
          path: app/.simcache/weekly
          key: weekly-data-${{ github.run_id }}
          restore-keys: weekly-data-
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run weekly:refresh
        working-directory: app
      - name: Publish verified forecast files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/public/weekly weekly analysis/weekly
          if ! git diff --cached --quiet; then
            git commit -m "Refresh weekly forecast data"
            git pull --rebase origin main
            git push origin HEAD:main
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          fi
