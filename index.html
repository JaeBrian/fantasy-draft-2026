j`]],[`Puka Nacua`,`WR`,`LAR`,4.1,`risk`,2,1,`Best per-route receiver alive — with TWO live risks: the conduct ruling is still open (Schefter keeps a Week 1+ ban possible), and now a groin has him out of practice with McVay in no hurry (8/17). Zero games + healthy = top-4 pick. Check the news draft morning.`,[`susp`,`ceil`,`inj`]],[`Justin Jefferson`,`WR`,`MIN`,11.1,`buy`,2,1,`Still a buy: 30% target share even in 2025's broken offense, and Kyler (5th-most-accurate QB ever) is a massive upgrade. Two honest caps: Kyler's availability (41 of 68 games in four years) and his 17.5 passing-TD Vegas line — expect the bounce as catches-and-yards more than a TD spike.`,[`bnc`,`ceil`]],[`Jonathan Taylor`,`RB`,`IND`,7.8,`solid`,2,2,`323 carries behind a top-10 line. But 20 TDs on a 14.4 expected — and 11 of the 13 backs to hit 18+ rushing TDs since 2000 declined the next year (avg -12). Round 1 yes, top-5 no.`,[`bell`,`reg`,`floor`]],[`James Cook`,`RB`,`BUF`,10.1,`solid`,2,2,`Goal-line back in a top-2 offense; 300+ carries. The quiet flag: 14 TDs on a 10.1 expected, and Allen vultures. New OC is expanding his receiving role — half-PPR likes that.`,[`bell`,`floor`,`reg`]],[`CeeDee Lamb`,`WR`,`DAL`,9.7,`buy`,2,1,`3 TDs on 6.6 expected, Pickens now drawing coverage, and the best Weeks 15-17 slate in football. Everything points up.`,[`bnc`,`ceil`]],[`Derrick Henry`,`RB`,`BAL`,17.1,`solid`,2,2,`Still the bellcow at 32 — and the new OC publicly pledges 'no limits' plus MORE passing-game work. The interior line is the real worry; the mild discount is fair.`,[`bell`,`age`,`floor`]],[`Saquon Barkley`,`RB`,`PHI`,13.8,`solid`,3,2,`Elite O-line, true workhorse. Two knocks: he's 29 (the high-volume cliff starts here), and Philly's Wks 15-17 slate (@SEA, HOU, @SF) is the league's worst — the mirror of their easy regular season.`,[`bell`,`floor`,`age`]],[`Kenneth Walker III`,`RB`,`KC`,14.4,`buy`,3,2,`Super Bowl MVP, paid record FA money to be Mahomes' bellcow, camp reports rave about his screen usage. Market still prices the old boring KC backfield.`,[`bell`,`ceil`]],[`Chase Brown`,`RB`,`CIN`,14.8,`solid`,3,2,`Lead back in a top-4 Vegas offense. The market fully caught on — he's soared into round 2 (RB9-ish). ESPN home leagues still get him a full round late.`,[`bell`,`floor`]],[`A.J. Brown`,`WR`,`NE`,19,`buy`,3,2,`Traded to the #2 scoring offense with Drake Maye (led NFL in comp% + Y/A). Projected 130 targets. Alpha again.`,[`ceil`]],[`Drake London`,`WR`,`ATL`,21.4,`solid`,3,2,`28%+ target share in three of four seasons; 14.0 PPG when healthy. Quiet, elite floor.`,[`floor`]],[`Ashton Jeanty`,`RB`,`LV`,12,`risk`,3,3,`The staff is targeting 300-335 touches and signed Linderbaum to block for him. The drag: a bottom-tier offense with Cousins-now, rookie-Mendoza-later QB murk. Fine at 15-18; a reach at 10-12. Low-ankle sprain, uncertain for Week 1 (Rapoport, Aug 25).`,[`bell`,`y2`,`bb`]],[`Brock Bowers`,`TE`,`LV`,19.9,`solid`,3,1,`The TE1. On pace to challenge McBride's 169-target record in a Kubiak scheme that feeds TEs. One caveat: Vegas's QB plan (Cousins now, rookie Mendoza looming). Take him here or punt the position.`,[`floor`,`ceil`]],[`Omarion Hampton`,`RB`,`LAC`,16.5,`solid`,3,3,`'Most growth of anybody' per McDaniel, and PFF's #2 coaching-change riser (elite outside-zone fit). One honest caveat: McDaniel keeps saying all three backs will play. Lead role, not a monopoly.`,[`bell`,`y2`,`brk`]],[`George Pickens`,`WR`,`DAL`,23.4,`buy`,3,2,`137 targets last year, franchise-tagged, and the Cowboys are THE playoff-week stack (77.6 implied pts, Wks 15-17).`,[`ceil`]],[`Nico Collins`,`WR`,`HOU`,23.1,`solid`,3,2,`True alpha share, and Houston finally spent on the line (Teller trade, two new tackles). Rebuilt ≠ proven — fine at this price, don't take him earlier.`,[`floor`]],[`Malik Nabers`,`WR`,`NYG`,23.7,`risk`,3,2,`Trending toward Week 1 — best camp week yet (full-speed 11-on-11s, caught everything) — but the Giants admit an IR-to-Week-5 open is still possible. Upside WR2 price, WR1 ceiling, real tail risk. Practiced Tuesday, but he himself is non-committal on Week 1 (Pat Leonard, NY Daily News, Aug 31). Your call.`,[`rec`,`ceil`,`bb`]],[`De'Von Achane`,`RB`,`MIA`,17.2,`avoid`,3,3,`The volume will be there (new staff floats 40-touch games). The fade: 12 TDs on 7.2 expected, 7+ injuries in four seasons, the NFL's lowest win total — and Willis-style mobile QBs historically starve RB targets, which was the Tua-fed half of his game. Not at a round-2 price.`,[`bell`,`inj`,`reg`,`bb`]],[`DeVonta Smith`,`WR`,`PHI`,27.9,`buy`,4,2,`A.J. Brown's exit makes him the unquestioned alpha for the first time. The consensus 'this year's JSN' candidate.`,[`brk`,`floor`]],[`Breece Hall`,`RB`,`NYJ`,28.4,`risk`,4,3,`Recovering from the August groin injury. The Jets' September 1 report says Hall and Braelon Allen are working toward the regular season; Hall's Week 1 availability still needs confirmation. Check Tuesday's practice update.`,[`bell`,`bnc`,`inj`]],[`Chris Olave`,`WR`,`NO`,29.8,`solid`,4,2,`20.2 PPG and 9.9 targets/game once Shough took over, then paid $132M this month. The room keeps thinning (Tyson out ~2 months) — volume locked in.`,[`floor`]],[`Emeka Egbuka`,`WR`,`TB`,32.3,`buy`,4,2,`Led ALL rookies with 127 targets; Evans' volume is his now. Fresh flag: sprained toe since Aug 12 and still not practicing Sept 1 (Greg Auman, Fox Sports); specialists call it a stable sprain, Bowles says 'hopefully' Week 1 — verify draft morning. If healthy, the breakout consensus is earned.`,[`y2`,`brk`,`ceil`]],[`Rashee Rice`,`WR`,`KC`,26.8,`risk`,4,2,`Mahomes' WR1, no new suspension expected — but one healthy season in three and May knee surgery. WR1 price, WR2 risk profile.`,[`inj`,`ceil`]],[`Trey McBride`,`TE`,`ARI`,29.7,`risk`,4,1,`TE-record 126 catches on 169 targets — now with Brissett confirmed at QB and a rookie RB eating checkdowns. Still consensus top-2 at the position; just priced for perfection.`,[`reg`,`floor`]],[`Kyren Williams`,`RB`,`LAR`,32.2,`buy`,4,3,`RB7/RB7/RB9 three straight years, 66% of Rams red-zone work, #1 scoring offense. The Corum fear is your discount.`,[`bell`,`floor`]],[`Josh Allen`,`QB`,`BUF`,36.3,`solid`,4,1,`The only QB worth an early pick: top-2 at the position 5 of 6 years, 500+ rush yards five straight, now with DJ Moore. If he slides to Rd 3, sprint.`,[`floor`,`ceil`]],[`Zay Flowers`,`WR`,`BAL`,31,`solid`,4,3,`5 TDs on 1,211 yards — 2nd-fewest of the 52 WRs to hit 1,200 since 2011 (group avg: 9.6) — and Baltimore just paid him $140M like a true WR1. The bounce is mathematically favored; Henry still owns the goal line.`,[`bnc`,`cap`]],[`Ladd McConkey`,`WR`,`LAC`,34.1,`buy`,4,3,`McDaniel's new slot engine behind a healthier line. Classic scheme-tailwind bounce-back.`,[`brk`,`bnc`]],[`Jeremiyah Love`,`RB`,`ARI`,25.5,`risk`,4,3,`#3 overall pick, a true three-down profile (11-for-58 in his debut before the injury). But the team's Week 1 hope fights high-ankle-sprain reality (2-3 month norm), and Conner AND Benson are hurt too. Pounce only if the ankle discounts him. Sept 1: 'trending toward Week 1' (Josh Weinfuss, ESPN) but '50/50' per Mike Garafolo, NFL Network — at practice Tuesday, not in it.`,[`comm`,`rk`,`bb`,`rec`]],[`Javonte Williams`,`RB`,`DAL`,35.3,`solid`,4,4,`287 touches and 13 total TDs last year, re-signed for $24M. Dallas waived Jaydon Blue; Williams remains the lead back. Compare the price against the remaining RB tier.`,[`bell`,`floor`,`cap`]],[`Tee Higgins`,`WR`,`CIN`,35.1,`risk`,4,3,`12 missed games in 3 years and 11 TDs on 6.5 expected. The talent is real; the price ignores both flags. Q on Sleeper: heel contusion, 'not a major concern' for Week 1 (Ben Baby, ESPN, Sept 1).`,[`inj`,`reg`]],[`Tetairoa McMillan`,`WR`,`CAR`,39.8,`solid`,4,3,`Won Offensive Rookie of the Year over Egbuka — 122 targets, 1,014 yards — then added 8 lbs of muscle, and Canales is expanding his slot usage. The safer sophomore.`,[`y2`,`floor`]],[`Jaylen Waddle`,`WR`,`DEN`,38.5,`buy`,4,3,`Traded (for a 1st) to PFF's #1 O-line, out of Miami's mess — camp calls his plays 'jaws-agape.' The leg strain cost him the preseason opener; Payton says minor. Confirm status, then buy.`,[`bnc`,`ceil`]],[`Garrett Wilson`,`WR`,`NYJ`,39.3,`solid`,4,3,`30% target share when healthy and Geno helps — but the Jets added two 1st-round pass-catchers. Jets tax applies.`,[`floor`]],[`Cam Skattebo`,`RB`,`NYG`,43.6,`solid`,4,4,`Got the actual preseason start (workload eased as the ankle ramps), and Harbaugh brought Greg Roman specifically to pound the rock. Lead back with a goal-line profile; Tracy is the 1B.`,[`bell`,`y2`,`rec`]],[`Colston Loveland`,`TE`,`CHI`,43.9,`buy`,4,2,`'Unguardable' in camp; the TE2 in fantasy from Week 9 on (12 targets/game over the final month), and now the listed TE1 over Kmet in Ben Johnson's play-action game. Top-2 upside, TE3 price.`,[`y2`,`brk`,`ceil`]],[`Terry McLaurin`,`WR`,`WAS`,47.1,`solid`,4,3,`2025 was an injury mirage — a recurring quad limited him to 10 games (38-582-3), not a usage decline. Healthy now with the $96M extension long settled; Diggs takes a slice of the pie.`,[`bnc`]],[`Travis Etienne Jr.`,`RB`,`NO`,42.4,`solid`,4,4,`Paid $52M for the early downs — camp confirms a role-split committee: Etienne carries, Kamara catches. Solid volume floor in a bottom-10 offense.`,[`comm`,`floor`,`cap`]],[`Luther Burden III`,`WR`,`CHI`,45.8,`risk`,4,3,`Ben Johnson moves him everywhere — slot, outside, even backfield — not a pure Amon-Ra clone. The Aug 8 groin likely costs him all of preseason; Bears expect Wk 1. Take the discount, don't pay sticker.`,[`y2`,`rec`,`bb`]],[`D'Andre Swift`,`RB`,`CHI`,47.6,`solid`,4,4,`Ben Johnson's lead back in a rising offense — and Monangai's knee (out weeks) clears his early-season lane. Johnson's Detroit history says committee eventually; volume now.`,[`comm`,`floor`,`cap`]],[`David Montgomery`,`RB`,`HOU`,47.3,`solid`,4,4,`DeMeco is building a Lions-style TANDEM with Woody Marks — health, game-flow and matchups drive the split, so don't assume the goal line is all his. Rebuilt O-line helps the whole room.`,[`comm`,`floor`,`cap`]],[`Josh Jacobs`,`RB`,`GB`,41.4,`avoid`,4,4,`ON THE COMMISSIONER'S EXEMPT LIST as of Aug 30 (Adam Schefter, ESPN) — cannot play or practice until the league acts, no end date. Formally charged with two misdemeanors; first court date Nov 17 (Rob Demovsky, ESPN). Return timing remains uncertain; Gutekunst 'anticipates' him playing at some point in 2026 (Matt Schneidman, The Athletic, Sept 1) — no date. At Rd 3-4 cost, a landmine.`,[`bell`,`susp`,`inj`]],[`Rome Odunze`,`WR`,`CHI`,58.4,`buy`,5,4,`On breakout lists everywhere (SI, FantasyPros, Yahoo — Winks projects top-20): 41% of targets 15+ yards downfield, Moore AND Allen gone. He's the favorite in a live WR1 battle with Burden — watch final-preseason usage.`,[`brk`,`ceil`]],[`Mike Evans`,`WR`,`SF`,48.9,`risk`,5,3,`Pearsall's out for the year, so the targets are real. But he turns 33 with 12 missed games over two seasons, and his contested-catch game fights Shanahan's YAC scheme. Fair price, capped ceiling.`,[`age`,`cap`]],[`Quinshon Judkins`,`RB`,`CLE`,53.2,`solid`,5,4,`'Looked 100%' after the ankle; locked starter with goal-line work. The league-worst O-line is the tax.`,[`bell`,`y2`,`floor`,`cap`]],[`DJ Moore`,`WR`,`BUF`,53.3,`buy`,5,4,`Traded into a top-2 offense where HC Joe Brady's system made 13 different Bills score TDs — priced like a WR27. Preseason ankle scare (8/15) called 'encouraging'; verify, then buy.`,[`bnc`,`ceil`]],[`Lamar Jackson`,`QB`,`BAL`,56.2,`buy`,5,2,`The down 2025 was a hamstring, not decline. Top-2 QB upside at a round-5 price — the best QB value on the board.`,[`ceil`,`bnc`]],[`Drake Maye`,`QB`,`NE`,67.1,`buy`,5,2,`QB2 overall last year, now throwing to A.J. Brown. If you miss Allen/Lamar, he's the pick.`,[`ceil`]],[`Jameson Williams`,`WR`,`DET`,51.7,`solid`,5,4,`Elite deep threat, but his production dips sharply when LaPorta is on the field — and a mid-August shoulder issue is limiting camp reps. Boom-bust WR3.`,[`bb`]],[`Bhayshul Tuten`,`RB`,`JAX`,50.9,`risk`,5,4,`The depth chart literally reads 'Tuten OR Rodriguez,' with Rodriguez ticketed for the goal line and LeQuint Allen for third downs — and JAX won't play starters in preseason, so it stays murky. Year-2 talent, committee price.`,[`comm`,`y2`,`bb`,`brk`]],[`Davante Adams`,`WR`,`LAR`,52.2,`risk`,5,4,`14 TDs — 9 from inside the 5 — drove 38% of his points on a career-worst 52.6% catch rate, and he turns 34 in December. Projections say ~10 TDs. The one comfort: he just proved age 33 can still be WR8.`,[`age`,`reg`]],[`Bucky Irving`,`RB`,`TB`,54.6,`risk`,5,4,`'Chairman of a committee': success rate cratered to 41.6% (46th of 48) and Tampa gave him ZERO carries inside the 5 last year — Tucker owned them, and Gainwell was signed. Elite line keeps him afloat.`,[`comm`,`cap`]],[`Christian Watson`,`WR`,`GB`,57.5,`solid`,5,4,`Green Bay quietly traded away Doubs AND Wicks — someone has to catch the ball. Target-vacuum bet.`,[`bb`]],[`Tyler Warren`,`TE`,`IND`,62.1,`buy`,5,2,`817 yards as a rookie (a Colts TE record) plus a Pro Bowl nod, and Pittman's 100+ targets just left for Pittsburgh. Elite-TE volume at a round-6 price. Take him at cost.`,[`y2`,`brk`,`ceil`]],[`Carnell Tate`,`WR`,`TEN`,61.7,`solid`,5,4,`The safest rookie profile: instant WR1, elite capital, zero drops on 66 targets last year. Fresh flag: Q — missed practice Sept 1 with 'stiffness'; Saleh won't say what or how long (Turron Davenport, ESPN). Check status draft morning. Bottom-tier offense caps the ceiling.`,[`rk`,`floor`,`cap`]],[`TreVeyon Henderson`,`RB`,`NE`,57.4,`risk`,5,4,`Explosive (top-10 RB down the 2025 stretch), but the Patriots are now openly planning a 50-50 split — and his share is gated on pass-pro improvement. Price assumes a takeover nobody in the building is promising. Right ankle (Aug 24): still not cleared for full practice as of Sept 1 (Mike Reiss, ESPN).`,[`comm`,`y2`,`bb`,`ceil`]],[`Jadarian Price`,`RB`,`SEA`,61.9,`risk`,5,4,`'Prime Dalvin Cook' burst (a teammate's actual quote) and back with the 1s — but the first depth chart briefly listed UDFA George Holani as starter during his soreness blip, and Charbonnet returns ~Wk 5-6. High-variance committee lead.`,[`comm`,`rk`,`bb`,`ceil`]],[`Brian Thomas Jr.`,`WR`,`JAX`,64,`solid`,5,4,`2025's headline bust — mostly QB chaos. Camp raves about a 'dominant offseason' and the Jags turned down multiple trade offers for him. Decent bounce-back odds at a two-round discount.`,[`bnc`,`bb`]],[`Parker Washington`,`WR`,`JAX`,58.7,`solid`,5,4,`Three-list consensus breakout (14+ PPG from Week 9 on) — and Hunter's shift to full-time CB hands his target share a tailwind. He or Thomas is the alpha; both are startable.`,[`brk`,`bb`]],[`Joe Burrow`,`QB`,`CIN`,68.4,`solid`,5,2,`Vegas favorite to lead the NFL in passing yards AND TDs. The best stack partner alive (Chase, Higgins).`,[`floor`,`ceil`]],[`Jayden Daniels`,`QB`,`WAS`,69.6,`solid`,5,2,`Rushing floor + a real WR duo now (McLaurin, Diggs). The wrinkle has a name: first-time play-caller David Blough, who wants more under-center work — camp says Daniels is 'accurate as he's ever been' in it.`,[`ceil`]],[`Marvin Harrison Jr.`,`WR`,`ARI`,67.1,`risk`,5,3,`The talent is not the question. An injury-wrecked 2025 (41-608-4 in 12 games), Vegas's bottom-2 offense and Brissett's low ceiling are. Bounce-back bet, not a proven WR1.`,[`bb`,`bnc`]],[`Jaylen Warren`,`RB`,`PIT`,70.4,`solid`,5,4,`Named camp RB1, but Dowdle is genuinely pushing to overtake him — McCarthy calls BOTH 'four-down backs.' Run-first offense keeps the pie big; the split is live.`,[`comm`,`cap`]],[`Rhamondre Stevenson`,`RB`,`NE`,71.1,`solid`,5,4,`His half of the now-official 50-50 committee comes with the early downs and short yardage, in the #2 scoring offense. Unsexy RB3 with RB2 weeks — and he's a round cheaper than Henderson.`,[`comm`,`floor`,`cap`]],[`Quentin Johnston`,`WR`,`LAC`,74.7,`solid`,5,4,`ADP up 31 spots this summer — McDaniel's scheme lifts the whole passing game. Momentum play.`,[`bb`]],[`DK Metcalf`,`WR`,`PIT`,75.8,`risk`,5,4,`Genuine analyst split: PFF calls him a top-3 coaching-change WINNER (McCarthy's offenses rank top-4 in deep shots), while others see Rodgers' quick game + Pittman capping him. Boom case is real; so is the WR3 floor.`,[`bb`]],[`Jalen Hurts`,`QB`,`PHI`,72.8,`solid`,5,3,`The rushing TDs always come. Note: the league's toughest Weeks 15-17 slate.`,[`floor`]],[`Caleb Williams`,`QB`,`CHI`,73.2,`buy`,5,3,`QB5 in year one under Ben Johnson, and camp says he's 'no longer drowning' — pre-snap mastered, designed runs being added. The year-2-in-scheme leap is the buy.`,[`ceil`,`brk`]],[`Tony Pollard`,`RB`,`TEN`,76.7,`solid`,5,4,`Boring volume on a bad team. The foot has now cost him back-to-back practices (8/16-17) — beats call it minor, but check status draft morning.`,[`bell`,`floor`,`cap`]],[`Tucker Kraft`,`TE`,`GB`,78.2,`solid`,5,3,`ACL rehab ahead of schedule ('looks spectacular'). His TD rate will cool, but the thinned-out GB target tree helps.`,[`rec`,`reg`]],[`Jayden Reed`,`WR`,`GB`,79.6,`solid`,5,4,`Doubs and Wicks are gone; Reed's slot role is the passing game's stable center.`,[`bb`]],[`Justin Herbert`,`QB`,`LAC`,83.7,`buy`,5,3,`McDaniel is explicitly speeding up his release behind a healthier line. The market prices last year's sacks, not this year's scheme.`,[`ceil`]],[`Dak Prescott`,`QB`,`DAL`,80.8,`solid`,5,3,`Led the NFL with 600 attempts; dome-heavy playoff slate. The QB half of the best playoff stack.`,[`floor`]],[`Josh Downs`,`WR`,`IND`,81.8,`buy`,5,4,`Projection models put him ~40 picks above this price as the Colts' top target-earner. Groin called 'not serious' by Steichen with a quick return expected — confirm he's practicing before you draft. Buy.`,[`brk`]],[`Courtland Sutton`,`WR`,`DEN`,83.5,`solid`,5,4,`Steady red-zone role in a rising offense — though Waddle's arrival caps the target share.`,[`floor`,`cap`]],[`Rico Dowdle`,`RB`,`PIT`,85.5,`solid`,5,5,`The short-yardage half — and actively pushing Warren for the lead job per camp reports. TD-dependent flex with a real takeover path.`,[`comm`,`cap`,`brk`]],[`Trevor Lawrence`,`QB`,`JAX`,86.5,`solid`,5,4,`Resurgent under Coen (QB4 last year). Fine QB1 if you punted.`,[`floor`]],[`Brock Purdy`,`QB`,`SF`,102,`buy`,6,4,`~20 PPG when healthy — top-3 rate — and nobody drafts him. 'When healthy' is the catch: 9 of 17 games last year. Cheap enough to pair with a floor QB2.`,[`floor`,`inj`]],[`Chris Godwin Jr.`,`WR`,`TB`,87.5,`solid`,6,5,`Re-signed, reliable slot floor in a good offense; ceiling belongs to Egbuka. On ESPN he goes ~68 picks later than experts rank him — the biggest freebie on that platform.`,[`floor`,`cap`]],[`Sam LaPorta`,`TE`,`DET`,88.5,`solid`,6,2,`Top-5 TE in a top-3 offense, priced round 8 because 2025 was 'only' good. Easy value if you punted TE.`,[`floor`]],[`Blake Corum`,`RB`,`LAR`,89.5,`solid`,6,5,`The #1 handcuff in fantasy — paced 900+ rushing yards over the last 10 games of 2025. Standalone flex value, league-winner if Kyren misses.`,[`comm`,`cuff`,`ceil`]],[`RJ Harvey`,`RB`,`DEN`,88,`risk`,6,5,`Explosive receiver, brutal runner: 3rd-worst rushing success rate and 4th-worst rush yards over expected last year — and Denver re-signed Dobbins and drafted Coleman anyway. PPR-week flex, not a breakout.`,[`comm`,`y2`,`reg`,`bb`]],[`Jordan Addison`,`WR`,`MIN`,90.1,`solid`,6,5,`TD-unlucky in 2025 and Kyler raises the boat — but a camp thumb injury is slowing the rapport-building. Solid WR4 with WR2 stretches.`,[`bnc`]],[`Jonathon Brooks`,`RB`,`CAR`,78.8,`risk`,6,5,`ADP up ~20 spots on health buzz — for 9 career carries and two ACL tears. Real explosiveness buzz, and he starts preseason G2 with Hubbard out — but Hubbard is still expected back Wk 1. Priced for the story.`,[`comm`,`inj`,`rec`]],[`Chuba Hubbard`,`RB`,`CAR`,95.1,`risk`,6,5,`Hamstring MRI, week-to-week, missed preseason G2 — but back on the practice field Sept 1 (Joe Person, The Athletic), and Canales is 'very confident' for Wk 1. Brooks is breathing on his neck (and sat Tuesday with soreness).`,[`bell`,`inj`]],[`J.K. Dobbins`,`RB`,`DEN`,96.4,`risk`,6,5,`Has never played a full season — though this camp's hamstring blip lasted exactly one day. The chart lists him RB1 ahead of Harvey. Great line, fragile bet.`,[`comm`,`inj`]],[`Patrick Mahomes`,`QB`,`KC`,97.3,`risk`,6,4,`Cleared and says the knee 'feels great' — but he's scaling back designed runs BY CHOICE to lean on Walker. The Konami floor that made him top-5 is gone either way. QB2 with a brand-name price.`,[`rec`,`cap`]],[`Kyle Monangai`,`RB`,`CHI`,98.6,`risk`,6,5,`Worse than first reported: Fowler says the hyperextended knee costs him the rest of camp ('multiple weeks') and Week 1 is genuinely in doubt. Was Ben Johnson's TD sneak; now a wait-and-see.`,[`comm`,`y2`,`cap`,`rec`]],[`Michael Pittman Jr.`,`WR`,`PIT`,99.3,`solid`,6,5,`Traded to Pittsburgh; steady possession role in a run-first offense.`,[`floor`,`cap`]],[`Stefon Diggs`,`WR`,`WAS`,100.9,`buy`,6,5,`Signed Aug 5 — the clear #2 opposite McLaurin with Daniels throwing. Biggest 7-day ADP riser in football (+33 spots) and slower platforms STILL lag. Move before your room catches up.`,[`bnc`]],[`Jordan Mason`,`RB`,`MIN`,103.1,`buy`,6,5,`Quietly winning Minnesota's backfield from an aging Aaron Jones (13.5 PPG as a 2025 fill-in). A starting RB in round 8-9.`,[`comm`,`brk`,`floor`]],[`Jaxson Dart`,`QB`,`NYG`,101.6,`solid`,6,4,`QB14 as a rookie on the strength of his legs (487 rush yds, 9 rush TDs); adds Likely and (eventually) Nabers. Small flag: several camp medical-tent visits. Fine late QB1.`,[`y2`,`ceil`]],[`Xavier Worthy`,`WR`,`KC`,105.1,`solid`,6,5,`Fallen to a WR4 price and the models still flag him — but the split is brutal: with Rice on the field he's averaged ~2.7 catches and ~8 PPG. Ceiling dart that mostly needs a Rice absence.`,[`ceil`,`bb`]],[`Matthew Golden`,`WR`,`GB`,104.9,`buy`,6,5,`Model-projected ~40 picks above price in a receiver room that just lost two starters.`,[`y2`,`brk`]],[`Bo Nix`,`QB`,`DEN`,107,`buy`,6,4,`QB7 two straight years, best O-line in football, they traded a 1st for Waddle — and he's priced QB14. Buy.`,[`floor`]],[`Jacory Croskey-Merritt`,`RB`,`WAS`,107.6,`buy`,6,5,`The best efficiency profile (4.6 YPC, 8 TDs as a 7th-round rookie) in a genuinely OPEN six-back competition — charts disagree on the order and he's missed recent practice time. Models still love the price (+22 vs ADP); it's a bet, not a lock.`,[`comm`,`brk`,`bb`]],[`Kyle Pitts Sr.`,`TE`,`ATL`,102.5,`risk`,6,3,`19.0 PPG without London on the field, 9.6 with him. London is healthy — price him accordingly.`,[`bb`,`cap`]],[`Harold Fannin Jr.`,`TE`,`CLE`,102.4,`risk`,6,4,`Small-sample 2025 magic meets an unresolved QB room (Watson vs. Sanders). Bull case: new HC Monken genuinely feeds TEs. You're paying for the encore, not a discount.`,[`y2`,`reg`]],[`Matthew Stafford`,`QB`,`LAR`,108.8,`risk`,6,4,`Reigning MVP, 46 TDs at 38 — base rates say ~30 this year. Fine QB2; on ESPN his ADP runs two rounds hotter, don't chase it.`,[`age`,`reg`]],[`Jared Goff`,`QB`,`DET`,110.7,`solid`,6,4,`Four straight 4,000-yard years; the Amon-Ra stack partner. Steady late QB1.`,[`floor`,`cap`]],[`Kyler Murray`,`QB`,`MIN`,113.5,`buy`,6,4,`Named the Vikings' starter Aug 11 with Jefferson, Addison and Hockenson attached — still priced QB18. The late-round QB steal of 2026.`,[`bnc`,`ceil`,`inj`]],[`George Kittle`,`TE`,`SF`,113.8,`risk`,6,3,`Racing an aggressive Achilles timeline to Week 1. If the discount holds, low-end TE1 with spike weeks; any setback = Weeks 2-3. Activated off PUP Aug 30; limited in practice this week (Matt Barrows, The Athletic).`,[`rec`,`age`]],[`Rachaad White`,`RB`,`WAS`,114.4,`solid`,6,5,`Leads a genuinely open six-back battle on some charts — but Daniels' offenses target RBs at bottom-of-league rates (12.8-15.7%), so even the pass-catching floor is thinner than it looks. Don't pay for settled volume.`,[`comm`,`cap`,`bb`]],[`Khalil Shakir`,`WR`,`BUF`,130.9,`buy`,6,5,`Models put him ~57 picks above this price. Allen's most-trusted underneath target in a 26-point offense.`,[`floor`]],[`Wan'Dale Robinson`,`WR`,`TEN`,111.6,`solid`,6,5,`140 targets in 2025 (with NYG), now reunited with Daboll — whose offenses rank top-10 in slot targets — as Tennessee's volume piece. PPR-shaped, still fine in half.`,[`floor`,`cap`]],[`Jakobi Meyers`,`WR`,`JAX`,115.4,`solid`,6,5,`Dependable target-earner in a top-6 scoring offense from 2025.`,[`floor`,`cap`]],[`Makai Lemon`,`WR`,`PHI`,82.5,`risk`,6,6,`Round-1 pick with a real WR2 path — but this is his THIRD hamstring in 17 months, he's missed a week of camp, and the market is already correcting (-12 spots this week). Rd-12 dart, nothing more.`,[`rk`,`rec`,`bb`,`inj`]],[`Jordan Love`,`QB`,`GB`,116.3,`solid`,6,5,`Volatile but the receiver-room churn hurts. Matchup-play QB2.`,[`bb`]],[`Kenneth Gainwell`,`RB`,`TB`,109.5,`risk`,6,5,`The passing-down slice of a three-way committee; Mayfield red-zone stack appeal only.`,[`comm`,`cap`]],[`Isaiah Likely`,`TE`,`NYG`,125.7,`buy`,6,4,`Giants paid him $40M and he's been Dart's clear top read while Nabers ramps up. The best TE-punt target.`,[`brk`]],[`Tyler Shough`,`QB`,`NO`,125.5,`solid`,6,5,`18+ PPG down his rookie stretch; added Etienne and (when healthy) Tyson. Sneaky QB2 with starter upside.`,[`y2`,`brk`]],[`Malik Willis`,`QB`,`MIA`,134.8,`solid`,6,5,`The battle's over: 3yr/$67.5M, outplayed Ewers all camp, sealed it in the preseason opener. A 50+ rush-yds/game floor on a bad roster — streaming-QB gold.`,[`bb`,`brk`]],[`Baker Mayfield`,`QB`,`TB`,121.8,`solid`,6,5,`Elite line (Wirfs status worth a check), Egbuka stack — but Zac Robinson is his FIFTH OC in five years, the quiet continuity tax. Reliable late QB1-by-committee.`,[`floor`]],[`Jayden Higgins`,`WR`,`HOU`,121.2,`solid`,6,5,`Seized the clear #2 job opposite Nico — DeMeco flat-out: 'He's going to have a great year.' Big frame, real riser.`,[`y2`,`brk`]],[`Romeo Doubs`,`WR`,`NE`,118.3,`solid`,6,5,`Paid $68M to be the WR2 opposite A.J. Brown in the #2 scoring offense — a defined role, not a camp hope. Sneaky depth with Maye throwing.`,[`cap`,`floor`]],[`Michael Wilson`,`WR`,`ARI`,91.8,`solid`,6,5,`2025's waiver MVP stretch was real, but the Cardinals tax (bottom-2 offense, QB mess) applies to him too.`,[`bb`]],[`Dalton Kincaid`,`TE`,`BUF`,123.3,`risk`,6,4,`Best per-route TE in football on a tiny snap share. The bet is 'more usage' — experts say the market already over-bet it.`,[`bb`,`reg`,`inj`]],[`De'Zhaun Stribling`,`WR`,`SF`,126.4,`buy`,7,5,`7-63 in his debut (led the game, all first half) after the sharp money moved first (+64 spots in a week). SF's room is decimated: Pearsall out for the year, Aiyuk unresolved, Kirk hurt. Real snaps are coming.`,[`rk`,`brk`,`bb`]],[`Denzel Boston`,`WR`,`CLE`,140.3,`buy`,7,5,`The camp riser of the summer: promoted to first team while incumbent Jerry Jeudy visibly struggles. Shedeur-vs-Watson QB murk is the only drag. Basically free.`,[`rk`,`brk`]],[`Jake Ferguson`,`TE`,`DAL`,134,`solid`,7,4,`Dak's red-zone TE in the best playoff-schedule offense. Fine punt target.`,[`cap`]],[`Mark Andrews`,`TE`,`BAL`,130.8,`risk`,7,4,`Likely's exit helps, but experts have him among the most overdrafted TEs. Late only.`,[`age`,`cap`]],[`Zach Charbonnet`,`RB`,`SEA`,159.4,`buy`,7,6,`'The most proven handcuff in football' — but PUP rules mean a realistic Week 5-6 debut. Elite stash IF you can float the roster spot for a month.`,[`comm`,`cuff`,`rec`]],[`MarShawn Lloyd`,`RB`,`GB`,160.5,`buy`,7,6,`Green Bay's Week 1 starter with Jacobs on the exempt list — GM Gutekunst on Sept 1: 'as ready as he's ever been... he looks good' (Dennis Krause, Spectrum News 1). The Packers traded a 2028 sixth to Pittsburgh for Kaleb Johnson on Aug 30 as a power complement behind him; compare both backs' current prices and roles. One career regular-season game — durability is the bet.`,[`comm`,`cuff`,`bb`]],[`Tyler Allgeier`,`RB`,`ARI`,148.1,`buy`,7,6,`Took the BULK of first-team camp reps even before Love's sprain, and starts if Love isn't right (high-ankle norms say he may not be). Free insurance with a real early-season role.`,[`comm`,`cuff`]],[`Alvin Kamara`,`RB`,`NO`,161.8,`solid`,7,6,`Sprained MCL Aug 19, out at least a month (Schefter) — Week 1 is gone at best. Restructured to stay, and camp confirms he keeps the passing downs outright (Etienne gets the carries). Half-PPR trims his edge; the floor is real.`,[`comm`,`age`,`cap`]],[`Woody Marks`,`RB`,`HOU`,141.6,`buy`,7,6,`Not just insurance: DeMeco is explicitly building the Lions' Gibbs/Monty tandem with Marks in the Gibbs role. 5 TDs on 7.8 expected says positive regression too. Deep-league gold.`,[`comm`,`y2`,`bnc`]],[`Rashid Shaheed`,`WR`,`SEA`,133.8,`solid`,7,6,`Seattle's field-stretcher; JSN's gravity leaves him single coverage.`,[`bb`]],[`Deebo Samuel Sr.`,`WR`,`SF`,128,`risk`,7,6,`Healthy and 'explosive, lean' per camp, and Pearsall's season-ending injury feeds him targets — sharps moved him up 35-50 spots. But four straight years of hot-start-then-hurt is still the profile.`,[`inj`,`age`]],[`Dallas Goedert`,`TE`,`PHI`,135.1,`avoid`,7,5,`11 TDs on 60 catches (5.1 expected) — statistically extreme, and the market agrees: he went unsigned into free agency before a $7M one-year deal. Projections say TE20.`,[`age`,`reg`]],[`Sam Darnold`,`QB`,`SEA`,142.2,`solid`,7,5,`Super Bowl-winning continuity; fine streamer with a champion's schedule.`,[`floor`]],[`Daniel Jones`,`QB`,`IND`,146.8,`solid`,7,5,`Locked-in starter and the camp's been clean — though national reporting (8/17) questions whether the pre-Achilles wheels are all the way back, which caps the rushing floor. Stabilizes the Colts.`,[`rec`,`floor`]],[`C.J. Stroud`,`QB`,`HOU`,145.5,`solid`,7,5,`Improved AFC South schedule; O-line still the anchor dragging him down.`,[`cap`]],[`T.J. Hockenson`,`TE`,`MIN`,170.3,`solid`,7,4,`The Kyler lift is the theory; early usage is thin (5 snaps in the preseason opener). Free TE with spike weeks if the targets come — streamer until they do.`,[`bnc`,`cap`]],[`Oronde Gadsden II`,`TE`,`LAC`,167.5,`solid`,7,4,`McDaniel schemes touches to TEs — but the trade for David Njoku (a camp standout) splits that pie three ways. Deep-league punt, watch the usage.`,[`y2`,`brk`,`cap`]],[`Travis Kelce`,`TE`,`KC`,122.7,`avoid`,7,4,`Turns 37 with yards-per-target down four straight years (6.9 the last two vs 8.6 career), and Rice + Walker eat his targets. The name costs three rounds more than the player.`,[`age`,`reg`]],[`Isiah Pacheco`,`RB`,`DET`,168.9,`risk`,7,6,`Placed on INJURED RESERVE Sept 1 (Ari Meirov; Eric Woodyard, ESPN) with the back that cost him most of camp — out at least four games, earliest return Oct 11 vs ARI. Still the direct Gibbs handcuff from Week 5 on, and nothing else behind Gibbs is draftable (Sione Vaki: Sleeper ADP 527). The league's one IR slot makes him a free stash for whoever takes Gibbs.`,[`comm`,`cuff`,`inj`]],[`Tyrone Tracy Jr.`,`RB`,`NYG`,136.6,`solid`,7,6,`Trending toward the change-of-pace/passing-down half after Skattebo got the preseason start — still the direct insurance in a run-heavy scheme.`,[`comm`,`cuff`]],[`Tank Bigsby`,`RB`,`PHI`,151.1,`solid`,7,6,`The direct Saquon handcuff behind the league's best line — and Philly is openly using him to MANAGE Saquon's workload, so there's standalone touch value too. Zero-RB stash.`,[`comm`,`cuff`,`bb`]],[`Tyjae Spears`,`RB`,`TEN`,157.9,`solid`,7,6,`Pollard insurance with standalone passing-down work.`,[`comm`,`cuff`]],[`Keaton Mitchell`,`RB`,`LAC`,130.8,`risk`,7,6,`Explosive space player McDaniel could scheme for — but he was a healthy inactive in the preseason opener while Vidal played. The RB2 job is unresolved. Boom-or-bench.`,[`comm`,`bb`]],[`Jalen Coker`,`WR`,`CAR`,129.4,`risk`,7,6,`Carolina paid him $35M, but the 2025 sample was 33 catches in 11 games and Legette is real competition. Upside dart, not established volume.`,[`brk`,`bb`]],[`Dontayvion Wicks`,`WR`,`PHI`,166.3,`solid`,7,6,`Fowler says the org is 'really excited' — and his WR2 competition (a scuffling Hollywood Brown) is beatable. Cheap route to real snaps in a thin room.`,[`bb`,`brk`]],[`Zachariah Branch`,`WR`,`ATL`,184.4,`buy`,7,6,`50-yard TD in his first padded practice and the story of Falcons camp — though the slot's 1st-team reps still run through Zaccheaus. Path to WR2 for free; not there yet.`,[`rk`,`brk`]],[`Jordyn Tyson`,`WR`,`NO`,69.1,`risk`,7,6,`Elite rookie profile, clear #2 role — but Rapoport says the new hamstring costs him ~2 months (mid-late October). The best-ball ADP is stale by a mile; rd-14 stash or waiver add.`,[`rk`,`rec`]],[`Omar Cooper Jr.`,`WR`,`NYJ`,155.5,`risk`,7,6,`Fading: camp 'pitfalls' per his own WR coach, and Adonai Mitchell has the #2 job behind Wilson. Round-1 pedigree, last-round flier only.`,[`rk`,`bb`]],[`Travis Hunter`,`WR`,`JAX`,148.9,`risk`,7,5,`Trending the wrong way for fantasy: listed at starting CB and SECOND-string WR, with defensive reps climbing all camp (final commitment withheld until it counts). Talent's real; the WR snaps may not be.`,[`y2`,`cap`]],[`Keon Coleman`,`WR`,`BUF`,210,`solid`,7,6,`Has functionally locked the WR3 job (camp buzz + a preseason TD) in a top-2 offense. Banged up scoring it — check status. Last-round flier with a real role.`,[`bb`]],[`Cooper Kupp`,`WR`,`SEA`,211.1,`solid`,7,6,`Still in Seattle, still crafty — deep-league depth only at this stage.`,[`age`,`cap`]],[`Kenyon Sadiq`,`TE`,`NYJ`,178.5,`risk`,7,5,`Fastest TE forty ever recorded (4.39), but the hernia setback costs him ~2 weeks (Glenn still expects Wk 1) in a crowded, low-scoring passing game. Dynasty > redraft.`,[`rk`,`rec`]],[`Kaytron Allen`,`RB`,`WAS`,211.5,`buy`,7,6,`6th-round 'Fatman' who flashed in preseason (23-85-1 vs Miami) with a short-yardage path — though pass-pro concerns reportedly threaten his roster spot. Free last-round swing.`,[`comm`,`rk`,`cuff`,`bb`]],[`Aaron Jones Sr.`,`RB`,`MIN`,126.3,`risk`,7,5,`2,000+ career touches and Mason is visibly taking over. The fade side of the Minnesota backfield.`,[`comm`,`age`,`cap`]],[`Alec Pierce`,`WR`,`IND`,55,`risk`,7,5,`The market drafts him top-60, but he's on PUP after offseason foot surgery with zero camp reps — team says Wk 1, believe it when he practices. Deep-ball WR3 when right.`,[`rec`,`bb`]],[`Adonai Mitchell`,`WR`,`NYJ`,120,`solid`,7,5,`The other half of the Sauce Gardner trade is winning the Jets' #2 job — 'breakout candidate' per beat writers, now ahead of Cooper. Cheap path to real snaps.`,[`y2`,`brk`]],[`David Njoku`,`TE`,`LAC`,150,`solid`,7,4,`Traded in and instantly one of Chargers camp's standouts — McDaniel's TE-friendly scheme now has a proven pass-catcher in it. Late TE with spike weeks.`,[`floor`,`cap`]],[`Braelon Allen`,`RB`,`NYJ`,165,`buy`,7,6,`Breece's direct handcuff just became urgent — Hall strained his groin 8/17 — and Allen flashed in the preseason opener (31-yd TD). Add before your league reads the news.`,[`comm`,`cuff`,`bb`]],[`Ray Davis`,`RB`,`BUF`,146,`solid`,7,6,`James Cook's direct backup in an offense about to feed the RB room more (Carmichael scheme). Standard-issue high-value handcuff.`,[`comm`,`cuff`]],[`Chris Rodriguez Jr.`,`RB`,`JAX`,154,`solid`,7,6,`The other half of 'Tuten OR Rodriguez' — coaches have sketched him the goal-line role. TD-vulture flex if the split sticks.`,[`comm`,`bb`]],[`Jaydon Blue`,`RB`,`PHI`,180,`avoid`,7,6,`Signed to Philadelphia's practice squad September 1 after Dallas waived him. A promotion and an offensive role are still required for redraft value.`,[`cap`]],[`Brian Robinson Jr.`,`RB`,`ATL`,190,`solid`,7,6,`Signed to back up the highest-paid RB ever — the real Bijan handcuff in a run-first Stefanski scheme.`,[`comm`,`cuff`]],[`Ja'Kobi Lane`,`WR`,`BAL`,185,`buy`,7,6,`'Best Ravens WR camp in 27 years' per the beat, TD in the preseason opener, and the new OC wants to spread it around. Free upside.`,[`rk`,`brk`]],[`Malachi Fields`,`WR`,`NYG`,200,`buy`,7,6,`3rd-rounder the Giants traded up for, making a corroborated claim on the #2 job while Nabers ramps. Harbaugh: 'didn't play like a rookie.'`,[`rk`,`brk`]],[`Malik Benson`,`WR`,`LV`,205,`solid`,7,6,`'Vegas' biggest camp surprise' — first-team reps per the head coach. Role still fluid; watch cuts.`,[`rk`,`bb`]],[`Elic Ayomanor`,`WR`,`TEN`,198,`solid`,7,6,`Year-2 riser racing Tate for camp-standout honors — 2nd on the team in receiving as a rookie. Deep-league WR depth.`,[`y2`,`brk`]],[`Aaron Rodgers`,`QB`,`PIT`,180.4,`solid`,7,5,`'Zero debate' — his final season, reunited with McCarthy (his 13-year Packers HC) in a run-first, play-action scheme. Streamer at best — but a fine bye-week QB.`,[`age`,`cap`]],[`KC Concepcion`,`WR`,`CLE`,111,`solid`,7,6,`Source-backed depth option. Compare current projections, role and availability before drafting.`,[`depth`]],[`Mike Washington`,`RB`,`LV`,137.7,`solid`,7,6,`Source-backed depth option. Compare current projections, role and availability before drafting.`,[`depth`]],[`Jonah Coleman`,`RB`,`DEN`,147.3,`solid`,7,6,`Source-backed depth option. Compare current projections, role and availability before drafting.`,[`depth`]],[`Hunter Henry`,`TE`,`NE`,148.9,`solid`,7,5,`Source-backed depth option. Compare current projections, role and availability before drafting.`,[`depth`]],[`Kaelon Black`,`RB`,`SF`,161.3,`solid`,7,6,`Source-backed depth option. Compare current projections, role and availability before drafting.`,[`depth`]],[`Juwan Johnson`,`TE`,`NO`,162,`solid`,7,5,`Source-backed depth option. Compare current projections, role and availability before drafting.`,[`depth`]],[`Jalen Nailor`,`WR`,`LV`,167.7,`solid`,7,6,`Source-backed depth option. Compare current projections, role and availability before drafting.`,[`depth`]],[`Brenton Strange`,`TE`,`JAX`,170.1,`solid`,7,5,`Source-backed depth option. Compare current projections, role and availability before drafting.`,[`depth`]],[`Kay [170.4,16.6,154,204],"Tre Tucker":[130,9.3,105,149],"Cyrus Allen":[160.7,17.2,141,178],"Chig Okonkwo":[169.5,25.8,102,210],"Dylan Sampson":[164.9,18.9,124,189],"Caleb Douglas":[171.9,18.5,147,194],"Terrance Ferguson":[162.4,19,136,180],"Dalton Schultz":[160.1,29.6,119,197],"Jerry Jeudy":[126,9,102,147],"Jalen McMillan":[134,10.5,106,150],"Jauan Jennings":[141.3,10.1,125,167],"Chris Bell":[164.7,23.2,143,199],"Tre' Harris":[182.8,15.9,159,197],"Ryan Flournoy":[159.6,14.8,121,179],"Isaac TeSlaa":[185.2,7.3,177,196],"Calvin Ridley":[141.1,19.1,91,167],"Jacoby Brissett":[166.4,19.2,116,187],"Troy Franklin":[169.5,16.1,151,204]},x=[{when:`Sep 4, 2026 · audit refresh`,items:[{text:`Recalculated weekly projections using the live league scoring rules. Refreshed Sleeper and mock ADP, historical weekly spread, sourced news and all published simulation inputs.`},{text:`Expanded the legal draft pool to 235 distinct skill players. Fixed the Kenneth/Kenny Gainwell identity mismatch and Jaydon Blue’s team and role.`},{text:`The real advisor completed 900 full drafts across three opponent styles with zero illegal or missing picks. Projection stress tests show that later choices remain sensitive to assumptions; use the live alternatives.`},{text:`September 8 preparation: recheck Jacobs’ exempt status, Puka’s availability, and the latest practice reports for Chase, Higgins, Hall, Henderson and Egbuka. Earlier dated notes below describe the information available at that time.`}]},{when:`Sep 1, 2026 · 3:05 PM PT`,items:[{player:`Isiah Pacheco`,dir:`down`,text:`Placed on INJURED RESERVE Tuesday with the back that cost him most of camp (Ari Meirov; Eric Woodyard, ESPN) — out at least four games, earliest return Oct 11. He was the Gibbs handcuff; nothing else behind Gibbs is draftable (Sione Vaki’s Sleeper ADP is 527). The league’s one IR slot makes Pacheco a free late stash for whoever takes Gibbs. Sleeper lists him IR; his risk reads pMiss 0.67.`},{player:`MarShawn Lloyd`,dir:`up`,text:`Green Bay’s Week 1 starter. GM Gutekunst on Tuesday: “as ready as he’s ever been... he looks good” (Dennis Krause, Spectrum News 1). The Packers did trade a 2028 sixth to Pittsburgh for Kaleb Johnson on Aug 30 as a power complement, but Johnson’s Sleeper ADP is 575 — Lloyd is the only draftable share. His flag now reads +2.6 pts/wk from Jacobs’ risk.`},{player:`Josh Jacobs`,dir:`down`,text:`Gutekunst “anticipates” him playing at some point in 2026 (Matt Schneidman, The Athletic) — no date. Sleeper has moved his designation from O to NA and dropped him to fourth on the depth chart; pMiss 0.78.`},{player:`Jeremiyah Love`,dir:`down`,text:`“Trending toward Week 1” (Josh Weinfuss, ESPN) but “50/50” per Mike Garafolo (NFL Network). At practice Tuesday, not in it (Theo Mackie, Arizona Republic).`},{player:`Ja'Marr Chase`,dir:`up`,text:`Limited all week by design; Zac Taylor “feels good about” where he is and expects him for Week 1 (Ben Baby, ESPN). Tee Higgins is Q on Sleeper with a heel contusion the team calls minor — same report.`},{player:`Chuba Hubbard`,dir:`up`,text:`Back on the practice field Tuesday (Joe Person, The Athletic); Canales “very confident” for Week 1. Jonathon Brooks sat with soreness and picked up a Q.`},{player:`Carnell Tate`,dir:`down`,text:`Now Q — missed Tuesday with “stiffness” and Saleh won’t say what or for how long (Turron Davenport, ESPN).`},{player:`Emeka Egbuka`,dir:`down`,text:`Still not practicing on the toe he sprained Aug 12 (Greg Auman, Fox Sports). Specialists call the sprain stable; Bowles says “hopefully” Week 1. At 32 overall he is the second-highest player on the board with a live question.`},{player:`Ashton Jeanty`,dir:`down`,text:`Has not practiced since the Aug 25 sprain — working with trainers off to the side Tuesday (Sam Warren, The Athletic). Twelve days to Week 1.`},{player:`TreVeyon Henderson`,dir:`down`,text:`Still not cleared for full practice on the right ankle (Mike Reiss, ESPN) — eight days after the injury, with the Patriots already planning a split.`},{player:`Malik Nabers`,dir:`up`,text:`Practiced Tuesday in uniform (Connor Hughes, SNY); he himself is non-committal on Week 1 (Pat Leonard, NY Daily News).`},{text:`Also: George Kittle activated off PUP Aug 30 and limited this week (Matt Barrows, The Athletic); Zay Flowers set to fully practice next week and good for Week 1 (Matt Zenitz, CBS); Puka Nacua off to the side Monday after Sunday’s return (Nate Atkins); Kyle Monangai still “week-to-week” (Ben Johnson, via 670 The Score); Keaton Mitchell a fourth straight missed practice (Kris Rhim, ESPN); Kyren Williams flagged COMMITTEE off Nate Atkins’ expectation of a 50-50 split with Corum — a beat writer’s read, not a coach’s plan, and the flag moves nothing. Market: James Cook 8.2 → 9.9, Amon-Ra St. Brown 7.6 → 6.2, Travis Hunter 174 → 187 (28 defensive snaps to 2 offensive in the joint practice).`},{player:`Khalil Shakir`,dir:`down`,text:`Still not practicing Tuesday with an injury the Bills won’t name (Joe Buscaglia, The Athletic) — out since Aug 18 after already missing most of camp with a high-ankle sprain. Keon Coleman is back on the field.`},{player:`D'Andre Swift`,dir:`up`,text:`Ben Johnson says he is “primed for a big year” (Dan Wiederer, The Athletic), and Monangai is still “week-to-week” on the knee (670 The Score) — Roschon Johnson is the Week 1 RB2, not a threat.`},{player:`Tyler Allgeier`,dir:`up`,text:`James Conner went to injured reserve at the cutdown (ankle) — Week 5 at the earliest (NBC Sports). With Love 50/50, Allgeier is the only healthy back in Arizona.`},{text:`From the cutdown, off the wire: Green Bay traded a 2028 sixth to Pittsburgh for Kaleb Johnson (Aug 30, ESPN/NFL.com); Tank Dell opens on PUP, ineligible until Week 5, so Kayshon Boutte starts in Houston; Emmett Johnson won the Chiefs’ RB2 job behind Kenneth Walker III; Sean Tucker took a pay cut in Tampa — committee signal; Jaydon Blue landed on the Eagles’ practice squad (Schefter); Javonte Williams is locked atop Dallas’ depth chart after the cuts (Todd Archer, ESPN); Croskey-Merritt back to practice next week (John Keim, ESPN); Sadiq on track for Week 1 (Rosenblatt); DK Metcalf expected ready for Week 1 (Brooke Pryor, ESPN); Alec Pierce “hopeful” for Week 1 per Ballard. None of Johnson, Dell, Boutte, Conner or Tucker is on the board — their Sleeper ADPs are 194 or later.`},{text:`A tagger bug, fixed. “Placed on injured reserve” was filed under OUT FOR THE SEASON, so Jordyn Tyson has been carrying a season-long miss since Aug 31 and Pacheco would have too. After the Aug 30 cutdown, IR is a four-game minimum, not the year. It now gets its own IR tag, priced at four games or the longest reported timeline, whichever is longer: Tyson reads 9 games (Garafolo’s two months), Pacheco 4, and Jayden Higgins’ torn ACL still reads season-ending. No new constants — four games is the league’s rule.`},{text:`Every study regenerated on the corrected wire and today’s market. Seat 2 wins 38% (RB-WR-RB-RB, 123.3 pts/wk): Bijan is there 85%, Gibbs 17%. Head-to-head: Brian 111.2 pts/wk (best team 40%), Ashley 108.9 (34%), Emily 104.8 (26%). Biggest value falls on Sleeper right now: Purdy +40 picks vs our rank, Goff +38, Josh Downs +34, Quentin Johnston +31. Gates: logic 0 FAIL / 3 WARN, advisor 0, forecast 0, agreement 3 FAIL — the same three marginal calls as Aug 31, left standing.`}]},{when:`Aug 31, 2026 · 11:45 AM PT`,items:[{player:`Josh Jacobs`,dir:`down`,text:`Placed on the COMMISSIONER'S EXEMPT LIST (Adam Schefter, ESPN) — cannot play or practice until the league acts, no end date, paid in the meantime. Formally charged with two misdemeanors; first court appearance Nov 17 (Rob Demovsky, ESPN). Sleeper now lists him O; his ADP has already slid 28.5 → 34.6 and 42,000 leagues dropped him in a day.`},{player:`MarShawn Lloyd`,dir:`up`,text:`"Poised to begin the season as Green Bay's lead running back" (Matt Schneidman, The Athletic). The market repriced him over the weekend exactly as the handcuff model said it would: ADP 179 → 136, 449,000 adds in 24 hours. His flag now reads +2.3 pts/wk from Jacobs' risk.`},{player:`Jordyn Tyson`,dir:`down`,text:`Officially to injured reserve (Matthew Paras) — out at least the first four games on top of the two-month hamstring timeline. ADP 92 → 104 and falling.`},{player:`Zach Charbonnet`,dir:`down`,text:`Opens the season on PUP (Adam Schefter, ESPN) — out at least four games, formalising the Wk 5–6 return the board already assumed.`},{player:`Ashton Jeanty`,dir:`up`,text:`Avoids injured reserve (Sam Warren, The Athletic) and the Raiders are "counting on" him for the opener (Levi Edwards).`},{player:`Puka Nacua`,dir:`up`,text:`Back at practice Sunday (Sarah Barshop, ESPN), and expected to AVOID the commissioner's exempt list on the conduct case (Tom Pelissero, NFL Network).`},{player:`Xavier Worthy`,dir:`up`,text:`Cleared — no longer Questionable. Same for Quentin Johnston.`},{player:`Jaydon Blue`,dir:`down`,text:`Waived by the Cowboys (Adam Schefter, ESPN) and zeroed out of Sleeper's projections — off the board.`},{text:`The exempt-list wire items carry no keyword tag — the tagger has no rule for it — but nothing was missed: Sleeper's O designation carries the risk (Jacobs pMiss 0.67), which is the designed channel. A tag never moves a projection; a designation does.`},{text:`Every study regenerated on the post-weekend market. Seat 2 wins 39%: Bijan is there 87% and Gibbs falls only 15% — the room re-firmed on Gibbs first overall. Head-to-head: Brian 111.4 pts/wk (best team 39%), Ashley 109.5 (35%), Emily 105.2 (26%). Biggest value falls on Sleeper right now: Purdy +40 picks vs our rank, Goff +36, Josh Downs +34.`}]},{when:`Aug 27, 2026 · 1:00 PM PT`,items:[{player:`Ja'Marr Chase`,dir:`down`,text:`Banged his left knee Tuesday and sat Wednesday's practice — no brace, no timeline (Ben Baby, ESPN). Sleeper lists him Q. At 3.7 he is the first player on the board carrying a live question mark.`},{player:`Jahmyr Gibbs`,dir:`up`,text:`Sleeper ADP has slipped 1.1 → 1.9 while Bijan firmed 2.7 → 2.4. He now reaches pick 2 about 27% of the time, up from 5% on Aug 24 — and when he does he is the priority, +5.4 pts/wk over the field in the RB-LOSS room. Bijan is there 73%.`},{player:`Ashton Jeanty`,dir:`down`,text:`Low-ankle sprain — not believed serious, but uncertain for Week 1 (Ian Rapoport). Kubiak will only say "on the mend". Still Q at 11.3.`},{player:`Josh Jacobs`,dir:`down`,text:`The Packers are preparing for a suspension (Matt Schneidman, The Athletic), and the groin only allowed limited work as of Monday. The room still pays 29.5 for him.`},{player:`Isiah Pacheco`,dir:`down`,text:`Back and knee — up in the air for Week 1 (Colton Pouncy, The Athletic). He is the Gibbs handcuff, so this is a late-round question, not a Week 1 one.`},{player:`Alvin Kamara`,dir:`down`,text:`Still a month out (Schefter). Our model had quietly shortened that to one week after a newer Kendre Miller quote with no number in it arrived and outranked the report that had one — fixed; the month stands.`},{player:`Malik Nabers`,dir:`up`,text:`Out of the non-contact jersey and into 11-on-11 (Connor Hughes); Harbaugh says it is reasonable to assume he is ready for Week 1. Wednesday's early exit was not injury-related (Dan Duggan, The Athletic).`},{player:`Alec Pierce`,dir:`up`,text:`PUP → Questionable, expected back at practice this week (Stephen Holder, ESPN). That lifts his projection in the sim enough that it now prefers him to Jayden Reed at seat 1's round 6 — the board still says believe it when he practices.`},{player:`Tucker Kraft`,dir:`up`,text:`Expected full-go for Week 1, no snap count (Rob Demovsky, ESPN).`},{player:`Kenyon Sadiq`,dir:`down`,text:`Jets will scale back his role early after the hernia surgery (Zack Rosenblatt, The Athletic). Sleeper cut his projection 2.0 pts/wk on the same day.`},{player:`Mike Evans`,dir:`up`,text:`Groin considered minor; plans to play Week 1 (Jeremy Fowler, ESPN).`},{player:`Kenneth Walker III`,dir:`down`,text:`Sleeper lists him Questionable with a foot injury. Nothing sourced on it yet — no reporter, no timeline — so it shows as a knock, not a projected absence.`},{player:`MarShawn Lloyd`,dir:`up`,text:`Handcuffs are now priced for their starter's risk, measured rather than guessed: across 41 weeks in 2025 in which a starter sat, his backup scored 0.65 of the starter's own pts/wk more than usual (scripts/sim-cuffvalue.mjs). Lloyd carries +1.5 pts/wk from Jacobs' risk and reads 5.4, not 3.9; Pacheco +1.6, Brian Robinson +1.5, Allgeier +1.4, Bigsby +1.3. It applies to every seat, not just the starter's owner. A suspension with no reported length is not in Jacobs' risk, so this is the injury-and-verdict share only.`},{text:`Injury flags 37 → 42. New Q: Ja'Marr Chase, Kenneth Walker III, Zay Flowers (precautionary — ready for Week 1 per HC Minter, via Jonas Shaffer), Brian Thomas Jr., Josh Downs (calf, "very minor"), Wan'Dale Robinson (concussion evaluation — Turron Davenport, ESPN), Keaton Mitchell (setback).`},{text:`Sleeper republished its projections again. Quarterbacks up across the board — Kyler Murray +2.1, Burrow +2.0, Hurts +1.8, Purdy +1.6, Lamar +1.5, Mahomes +0.9 — plus McCaffrey +1.5 and Kittle +1.1. Down: Makai Lemon −2.2, Oronde Gadsden −2.1, Kenyon Sadiq −2.0, Luther Burden −1.2, Chuba Hubbard −1.2.`},{text:`Every study on the Simulations tab regenerated on today's numbers for seats 1, 2 and 10. Win rates read higher than Aug 24 — seat 2 is 43%, was 35% — and most of that is not the data. The Aug 24 numbers predate the opponent-model fix from later that day (no more four-quarterback rosters keeping backs on the board). Today's data alone moves seat 2 from 35% to 37%; the corrected room takes it to 43%. Head-to-head with all three sharp seats in one room: Brian 111.3 pts/wk (best team 40%), Ashley 109.4 (35%), Emily 104.2 (25%).`},{text:`Two more bugs caught in this pass. The seat head-to-head study still had Brian at pick 6 and had been crashing the pre-draft script since he moved to 2 — the Aug 24 run never got past its first study. And a rest note ("holding him out of Saturday's game") tagged Trey McBride as a contract holdout. Both fixed. With handcuffs priced, the two round-6 disagreements between advisor and simulation (Pierce/Reed, Watson/Warren) closed on their own; one new one opened at seat 1's round 3, where the sim prefers Jeremiyah Love to George Pickens by 1.17 pts/wk with Love still Q on the high-ankle sprain. Left standing rather than tuned away.`}]},{when:`Aug 24, 2026 · 11:00 AM PT`,items:[{player:`Ashton Jeanty`,dir:`down`,text:`Now listed Questionable. Watch this one — he is priced at 11.3 and a Q tag six days out is not nothing.`},{player:`George Kittle`,dir:`up`,text:`Upgraded PUP → Questionable, and Schefter has him ahead of schedule with a chance at Week 1. Our board briefly had him out for the year on a mis-read of his January surgery; that is fixed.`},{player:`TreVeyon Henderson`,dir:`down`,text:`Questionable.`},{player:`Jacory Croskey-Merritt`,dir:`down`,text:`Questionable.`},{player:`DeVonta Smith`,dir:`up`,text:`Cleared — no longer Questionable. Same for DJ Moore and Carnell Tate.`},{player:`Jahmyr Gibbs`,dir:`down`,text:`Reaches pick 2 only 5% of the time now, down from 11% — the market has firmed on him going first overall. Bijan Robinson is there 95%.`},{text:`Brian drafts from pick 2. Every study on the Simulations tab — priority order, RB-LOSS shapes, draft tree, plans, risk dial — regenerated on today's numbers for seats 1, 2 and 10.`},{text:`Two bugs caught in the pre-draft pass. A retrospective mention of January surgery was reading as a current season-ending injury; month names now count as historical. And a seat-name argument losing its quotes made two regenerations run zero seats while reporting success — they now fail loudly instead.`}]},{when:`Aug 20, 2026 · 2:15 PM PT`,items:[{player:`Jayden Higgins`,dir:`down`,text:`Slee cording to The Athletic's Nate Atkins, Stafford and Adams excelled in joint practice with the New Orleans Saints on Thursday, connec`,a:`Nate Atkins`},{t:1786405926,s:`rotoballer`,h:`Davante Adams Gaining More Chemistry With Veteran QB`,d:`The Los Angeles Rams duo of quarterback Matthew Stafford and wide receiver Davante Adams is building a better rapport after failing to fully connect during last season's training camp. After Matthew Stafford (back) sat out all of training camp, he and Adams we`,a:`direct quote`}],"Keenan Allen":[{t:1788276623,s:`rotowire`,h:`Keenan Allen - Will play Week 1, per GM`,d:`Colts general manager Chris Ballard said Tuesday that Allen will play in Week 1 against the Ravens, Jake Arthur of Colts Roundtable reports.`,a:`GM`},{t:1788101286,s:`rotoballer`,h:`Keenan Allen Faces Potential Three-Game Suspension`,d:`Keenan Allen Faces Potential Three-Game Suspension.`,a:`Mark Maske`,g:`suspended`}],"Travis Kelce":[{t:1786588675,s:`rotowire`,h:`Travis Kelce - Looking to bounce back in 2026`,d:`Kelce said Wednesday that he wants to "prove to myself that I can play at a better level than I did last year" this upcoming season, Nate Taylor of ESPN.com reports.`,a:`Nate Taylor, ESPN`},{t:1786560427,s:`rotoballer`,h:`Travis Kelce Says he Can Still "Play at a High Level"`,d:`In what could be his final NFL season in 2026, Kansas City Chiefs tight end Travis Kelce thinks he can still "play at a high level," according to Nate Taylor of ESPN. "I've still got a lot of love for this game," Kelce said Wednesday. "I want to go out there a`,a:`Nate Taylor, ESPN`},{t:1786541827,s:`rotoballer`,h:`Kenneth Walker Called an "Absolute Superstar"`,d:`According to Charles Goldman, Travis Kelce said Walker is "going to be a hell of a ball player for us," praised his all-around traits, and called him an "absolute superstar" on and off the field.`,a:`direct quote`,g:`hype`}],"Stefon Diggs":[{t:1787407984,s:`rotowire`,h:`Stefon Diggs - Will make preseason debut`,d:`Diggs is  and availability reports.`],[`Puka Nacua`,`Check the groin injury and any official conduct ruling; return and suspension timing remain uncertain.`],[`Isiah Pacheco / Jordyn Tyson`,`Account for the reported early absence and your single IR slot before using a bench pick.`]],Fe=[[`Bellcow / workhorse`,`A running back who gets almost all of his team's carries AND catches. The most valuable thing in fantasy — there are only ~10 of them.`],[`Committee / timeshare`,`The opposite: 2–3 RBs splitting the work. Splits kill fantasy value — you never know who gets the good week.`],[`Target`,`A pass thrown a player's way, catch or not. Targets measure how much an offense feeds someone — the best predictor of future catches.`],[`Target share ("28% share")`,`The percent of his team's passes thrown at him. 20% is good, 25% is elite, 30%+ is historic. "44% of Seattle's passing yards" = nearly half their air offense went through one man.`],[`Expected TDs ("3 TDs on 6.6 expected")`,`A model counts a player's scoring chances (like catches near the goal line) and says how many TDs an average player scores on those chances. Scoring way UNDER it = he was unlucky, bet on more next year. Way OVER = lucky, bet on fewer.`],[`TD regression / bounce-back`,`The follow-through on that math: "regression" = his touchdowns should drop; "bounce-back" = they should recover.`],[`ADP`,`Average Draft Position — the pick where the crowd usually takes a player. It's the "market price."`],[`Reach / value`,`Drafting someone well before his ADP = a reach. Getting him after = a value.`],[`Snake draft`,`The order reverses every round (1→12, then 12→1) so the person picking last gets two picks back-to-back "at the turn."`],[`Half-PPR`,`Point Per Reception, halved: every catch = 0.5 points, plus the normal yardage/TD points. Full-PPR = 1 point per catch; standard = 0.`],[`Flex`,`A lineup spot that accepts an RB, WR, or TE — your best leftover starter.`],[`Tier / tier cliff`,`A group of players of similar value; the "cliff" is the drop to the next group. Draft the last man in a tier, not the first man of the next one.`],[`RB dead zone`,`Rounds ~4–7 this year, where every RB left is a committee guy or injury risk. Buying RBs there is how drafts are lost.`]],Ie=[[`Handcuff`,`The direct backup to a star RB. If the star gets hurt, the handcuff inherits the whole job — insurance for one roster spot.`],[`Sleeper / breakout / bust`,`Sleeper = cheap player who could massively outperform. Breakout = young player about to jump a level. Bust = expensive player about to disappoint.`],[`Floor / ceiling`,`Floor = his realistic bad outcome; ceiling = his realistic great one. "High floor" = safe. "High ceiling" = can win you the league. Boom-bust = huge weeks AND dud weeks.`],[`Red zone / goal line`,`Inside the opponent's 20-yard line / 5-yard line. Whoever gets the ball there scores the TDs — it's where fantasy points concentrate.`],[`Game script`,`How a game's score shapes play-calling: teams ahead run (good for RBs), teams behind throw (good for WRs). Vegas lines predict it.`],[`Implied team total`,`How many points Vegas expects a team to score in a game (or per game). More team points = more TDs to go around for your players.`],[`Stack`,`Drafting a QB plus his own receiver — when they connect for a TD, you get paid twice.`],[`Streaming`,`Not committing to one K/DST/QB — instead grabbing whoever has the best matchup each week off waivers.`],[`Waiver wire`,`The pool of undrafted players you can add during the season. Where leagues are won in September.`],[`Bye week`,`Each NFL team's one off-week. Your player scores zero that week — don't draft five starters with the same bye.`],[`Snap / opportunity share`,`Percent of the team's plays a player is on the field for, and the percent of the backfield's carries+targets he gets. Usage = opportunity = points.`],[`PPG`,`Fantasy points per game — the fairest way to compare players who missed time.`],[`IR slot`,`A bonus bench spot only for players
