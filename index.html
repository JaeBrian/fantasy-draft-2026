`]],[`Puka Nacua`,`WR`,`LAR`,4.1,`risk`,2,1,`Best per-route receiver alive — with TWO live risks: the conduct ruling is still open (Schefter keeps a Week 1+ ban possible), and now a groin has him out of practice with McVay in no hurry (8/17). Zero games + healthy = top-4 pick. Check the news draft morning.`,[`susp`,`ceil`,`inj`]],[`Justin Jefferson`,`WR`,`MIN`,11.1,`buy`,2,1,`Still a buy: 30% target share even in 2025's broken offense, and Kyler (5th-most-accurate QB ever) is a massive upgrade. Two honest caps: Kyler's availability (41 of 68 games in four years) and his 17.5 passing-TD Vegas line — expect the bounce as catches-and-yards more than a TD spike.`,[`bnc`,`ceil`]],[`Jonathan Taylor`,`RB`,`IND`,7.8,`solid`,2,2,`323 carries behind a top-10 line. But 20 TDs on a 14.4 expected — and 11 of the 13 backs to hit 18+ rushing TDs since 2000 declined the next year (avg -12). Round 1 yes, top-5 no.`,[`bell`,`reg`,`floor`]],[`James Cook`,`RB`,`BUF`,10.1,`solid`,2,2,`Goal-line back in a top-2 offense; 300+ carries. The quiet flag: 14 TDs on a 10.1 expected, and Allen vultures. New OC is expanding his receiving role — half-PPR likes that.`,[`bell`,`floor`,`reg`]],[`CeeDee Lamb`,`WR`,`DAL`,9.7,`buy`,2,1,`3 TDs on 6.6 expected, Pickens now drawing coverage, and the best Weeks 15-17 slate in football. Everything points up.`,[`bnc`,`ceil`]],[`Derrick Henry`,`RB`,`BAL`,17.1,`solid`,2,2,`Still the bellcow at 32 — and the new OC publicly pledges 'no limits' plus MORE passing-game work. The interior line is the real worry; the mild discount is fair.`,[`bell`,`age`,`floor`]],[`Saquon Barkley`,`RB`,`PHI`,13.8,`solid`,3,2,`Elite O-line, true workhorse. Two knocks: he's 29 (the high-volume cliff starts here), and Philly's Wks 15-17 slate (@SEA, HOU, @SF) is the league's worst — the mirror of their easy regular season.`,[`bell`,`floor`,`age`]],[`Kenneth Walker III`,`RB`,`KC`,14.4,`buy`,3,2,`Super Bowl MVP, paid record FA money to be Mahomes' bellcow, camp reports rave about his screen usage. Market still prices the old boring KC backfield.`,[`bell`,`ceil`]],[`Chase Brown`,`RB`,`CIN`,14.8,`solid`,3,2,`Lead back in a top-4 Vegas offense. The market fully caught on — he's soared into round 2 (RB9-ish). ESPN home leagues still get him a full round late.`,[`bell`,`floor`]],[`A.J. Brown`,`WR`,`NE`,19,`buy`,3,2,`Traded to the #2 scoring offense with Drake Maye (led NFL in comp% + Y/A). Projected 130 targets. Alpha again.`,[`ceil`]],[`Drake London`,`WR`,`ATL`,21.4,`solid`,3,2,`28%+ target share in three of four seasons; 14.0 PPG when healthy. Quiet, elite floor.`,[`floor`]],[`Ashton Jeanty`,`RB`,`LV`,12,`risk`,3,3,`The staff is targeting 300-335 touches and signed Linderbaum to block for him. The drag: a bottom-tier offense with Cousins-now, rookie-Mendoza-later QB murk. Fine at 15-18; a reach at 10-12. Low-ankle sprain, uncertain for Week 1 (Rapoport, Aug 25).`,[`bell`,`y2`,`bb`]],[`Brock Bowers`,`TE`,`LV`,19.9,`solid`,3,1,`The TE1. On pace to challenge McBride's 169-target record in a Kubiak scheme that feeds TEs. One caveat: Vegas's QB plan (Cousins now, rookie Mendoza looming). Take him here or punt the position.`,[`floor`,`ceil`]],[`Omarion Hampton`,`RB`,`LAC`,16.5,`solid`,3,3,`'Most growth of anybody' per McDaniel, and PFF's #2 coaching-change riser (elite outside-zone fit). One honest caveat: McDaniel keeps saying all three backs will play. Lead role, not a monopoly.`,[`bell`,`y2`,`brk`]],[`George Pickens`,`WR`,`DAL`,23.4,`buy`,3,2,`137 targets last year, franchise-tagged, and the Cowboys are THE playoff-week stack (77.6 implied pts, Wks 15-17).`,[`ceil`]],[`Nico Collins`,`WR`,`HOU`,23.1,`solid`,3,2,`True alpha share, and Houston finally spent on the line (Teller trade, two new tackles). Rebuilt ≠ proven — fine at this price, don't take him earlier.`,[`floor`]],[`Malik Nabers`,`WR`,`NYG`,23.7,`risk`,3,2,`Trending toward Week 1 — best camp week yet (full-speed 11-on-11s, caught everything) — but the Giants admit an IR-to-Week-5 open is still possible. Upside WR2 price, WR1 ceiling, real tail risk. Your call.`,[`rec`,`ceil`,`bb`]],[`De'Von Achane`,`RB`,`MIA`,17.2,`avoid`,3,3,`The volume will be there (new staff floats 40-touch games). The fade: 12 TDs on 7.2 expected, 7+ injuries in four seasons, the NFL's lowest win total — and Willis-style mobile QBs historically starve RB targets, which was the Tua-fed half of his game. Not at a round-2 price.`,[`bell`,`inj`,`reg`,`bb`]],[`DeVonta Smith`,`WR`,`PHI`,27.9,`buy`,4,2,`A.J. Brown's exit makes him the unquestioned alpha for the first time. The consensus 'this year's JSN' candidate.`,[`brk`,`floor`]],[`Breece Hall`,`RB`,`NYJ`,28.4,`risk`,4,3,`Paid $45M to stay, and Geno is a real QB upgrade — but he left practice TODAY (8/17) with a non-contact groin strain, timeline unknown. Get the injury news before you pay this price.`,[`bell`,`bnc`,`inj`]],[`Chris Olave`,`WR`,`NO`,29.8,`solid`,4,2,`20.2 PPG and 9.9 targets/game once Shough took over, then paid $132M this month. The room keeps thinning (Tyson out ~2 months) — volume locked in.`,[`floor`]],[`Emeka Egbuka`,`WR`,`TB`,32.3,`buy`,4,2,`Led ALL rookies with 127 targets; Evans' volume is his now. Fresh flag: sprained toe 8/13 and Bowles won't confirm Week 1 yet — verify draft morning. If healthy, the breakout consensus is earned.`,[`y2`,`brk`,`ceil`]],[`Rashee Rice`,`WR`,`KC`,26.8,`risk`,4,2,`Mahomes' WR1, no new suspension expected — but one healthy season in three and May knee surgery. WR1 price, WR2 risk profile.`,[`inj`,`ceil`]],[`Trey McBride`,`TE`,`ARI`,29.7,`risk`,4,1,`TE-record 126 catches on 169 targets — now with Brissett confirmed at QB and a rookie RB eating checkdowns. Still consensus top-2 at the position; just priced for perfection.`,[`reg`,`floor`]],[`Kyren Williams`,`RB`,`LAR`,32.2,`buy`,4,3,`RB7/RB7/RB9 three straight years, 66% of Rams red-zone work, #1 scoring offense. The Corum fear is your discount.`,[`bell`,`floor`]],[`Josh Allen`,`QB`,`BUF`,36.3,`solid`,4,1,`The only QB worth an early pick: top-2 at the position 5 of 6 years, 500+ rush yards five straight, now with DJ Moore. If he slides to Rd 3, sprint.`,[`floor`,`ceil`]],[`Zay Flowers`,`WR`,`BAL`,31,`solid`,4,3,`5 TDs on 1,211 yards — 2nd-fewest of the 52 WRs to hit 1,200 since 2011 (group avg: 9.6) — and Baltimore just paid him $140M like a true WR1. The bounce is mathematically favored; Henry still owns the goal line.`,[`bnc`,`cap`]],[`Ladd McConkey`,`WR`,`LAC`,34.1,`buy`,4,3,`McDaniel's new slot engine behind a healthier line. Classic scheme-tailwind bounce-back.`,[`brk`,`bnc`]],[`Jeremiyah Love`,`RB`,`ARI`,25.5,`risk`,4,3,`#3 overall pick, a true three-down profile (11-for-58 in his debut before the injury). But the team's Week 1 hope fights high-ankle-sprain reality (2-3 month norm), and Conner AND Benson are hurt too. Pounce only if the ankle discounts him.`,[`comm`,`rk`,`bb`,`rec`]],[`Javonte Williams`,`RB`,`DAL`,35.3,`solid`,4,4,`287 touches and 13 total TDs last year, re-signed for $24M. New flag: explosive rookie Jaydon Blue is making camp noise (fumbles are his leash). Bankable floor, watch the split.`,[`bell`,`floor`,`cap`]],[`Tee Higgins`,`WR`,`CIN`,35.1,`risk`,4,3,`12 missed games in 3 years and 11 TDs on 6.5 expected. The talent is real; the price ignores both flags.`,[`inj`,`reg`]],[`Tetairoa McMillan`,`WR`,`CAR`,39.8,`solid`,4,3,`Won Offensive Rookie of the Year over Egbuka — 122 targets, 1,014 yards — then added 8 lbs of muscle, and Canales is expanding his slot usage. The safer sophomore.`,[`y2`,`floor`]],[`Jaylen Waddle`,`WR`,`DEN`,38.5,`buy`,4,3,`Traded (for a 1st) to PFF's #1 O-line, out of Miami's mess — camp calls his plays 'jaws-agape.' The leg strain cost him the preseason opener; Payton says minor. Confirm status, then buy.`,[`bnc`,`ceil`]],[`Garrett Wilson`,`WR`,`NYJ`,39.3,`solid`,4,3,`30% target share when healthy and Geno helps — but the Jets added two 1st-round pass-catchers. Jets tax applies.`,[`floor`]],[`Cam Skattebo`,`RB`,`NYG`,43.6,`solid`,4,4,`Got the actual preseason start (workload eased as the ankle ramps), and Harbaugh brought Greg Roman specifically to pound the rock. Lead back with a goal-line profile; Tracy is the 1B.`,[`bell`,`y2`,`rec`]],[`Colston Loveland`,`TE`,`CHI`,43.9,`buy`,4,2,`'Unguardable' in camp; the TE2 in fantasy from Week 9 on (12 targets/game over the final month), and now the listed TE1 over Kmet in Ben Johnson's play-action game. Top-2 upside, TE3 price.`,[`y2`,`brk`,`ceil`]],[`Terry McLaurin`,`WR`,`WAS`,47.1,`solid`,4,3,`2025 was an injury mirage — a recurring quad limited him to 10 games (38-582-3), not a usage decline. Healthy now with the $96M extension long settled; Diggs takes a slice of the pie.`,[`bnc`]],[`Travis Etienne Jr.`,`RB`,`NO`,42.4,`solid`,4,4,`Paid $52M for the early downs — camp confirms a role-split committee: Etienne carries, Kamara catches. Solid volume floor in a bottom-10 offense.`,[`comm`,`floor`,`cap`]],[`Luther Burden III`,`WR`,`CHI`,45.8,`risk`,4,3,`Ben Johnson moves him everywhere — slot, outside, even backfield — not a pure Amon-Ra clone. The Aug 8 groin likely costs him all of preseason; Bears expect Wk 1. Take the discount, don't pay sticker.`,[`y2`,`rec`,`bb`]],[`D'Andre Swift`,`RB`,`CHI`,47.6,`solid`,4,4,`Ben Johnson's lead back in a rising offense — and Monangai's knee (out weeks) clears his early-season lane. Johnson's Detroit history says committee eventually; volume now.`,[`comm`,`floor`,`cap`]],[`David Montgomery`,`RB`,`HOU`,47.3,`solid`,4,4,`DeMeco is building a Lions-style TANDEM with Woody Marks — health, game-flow and matchups drive the split, so don't assume the goal line is all his. Rebuilt O-line helps the whole room.`,[`comm`,`floor`,`cap`]],[`Josh Jacobs`,`RB`,`GB`,41.4,`avoid`,4,4,`ON THE COMMISSIONER'S EXEMPT LIST as of Aug 30 (Adam Schefter, ESPN) — cannot play or practice until the league acts, no end date. Formally charged with two misdemeanors; first court date Nov 17 (Rob Demovsky, ESPN). Dead roster weight for at least weeks, maybe months. At Rd 3-4 cost, a landmine.`,[`bell`,`susp`,`inj`]],[`Rome Odunze`,`WR`,`CHI`,58.4,`buy`,5,4,`On breakout lists everywhere (SI, FantasyPros, Yahoo — Winks projects top-20): 41% of targets 15+ yards downfield, Moore AND Allen gone. He's the favorite in a live WR1 battle with Burden — watch final-preseason usage.`,[`brk`,`ceil`]],[`Mike Evans`,`WR`,`SF`,48.9,`risk`,5,3,`Pearsall's out for the year, so the targets are real. But he turns 33 with 12 missed games over two seasons, and his contested-catch game fights Shanahan's YAC scheme. Fair price, capped ceiling.`,[`age`,`cap`]],[`Quinshon Judkins`,`RB`,`CLE`,53.2,`solid`,5,4,`'Looked 100%' after the ankle; locked starter with goal-line work. The league-worst O-line is the tax.`,[`bell`,`y2`,`floor`,`cap`]],[`DJ Moore`,`WR`,`BUF`,53.3,`buy`,5,4,`Traded into a top-2 offense where HC Joe Brady's system made 13 different Bills score TDs — priced like a WR27. Preseason ankle scare (8/15) called 'encouraging'; verify, then buy.`,[`bnc`,`ceil`]],[`Lamar Jackson`,`QB`,`BAL`,56.2,`buy`,5,2,`The down 2025 was a hamstring, not decline. Top-2 QB upside at a round-5 price — the best QB value on the board.`,[`ceil`,`bnc`]],[`Drake Maye`,`QB`,`NE`,67.1,`buy`,5,2,`QB2 overall last year, now throwing to A.J. Brown. If you miss Allen/Lamar, he's the pick.`,[`ceil`]],[`Jameson Williams`,`WR`,`DET`,51.7,`solid`,5,4,`Elite deep threat, but his production dips sharply when LaPorta is on the field — and a mid-August shoulder issue is limiting camp reps. Boom-bust WR3.`,[`bb`]],[`Bhayshul Tuten`,`RB`,`JAX`,50.9,`risk`,5,4,`The depth chart literally reads 'Tuten OR Rodriguez,' with Rodriguez ticketed for the goal line and LeQuint Allen for third downs — and JAX won't play starters in preseason, so it stays murky. Year-2 talent, committee price.`,[`comm`,`y2`,`bb`,`brk`]],[`Davante Adams`,`WR`,`LAR`,52.2,`risk`,5,4,`14 TDs — 9 from inside the 5 — drove 38% of his points on a career-worst 52.6% catch rate, and he turns 34 in December. Projections say ~10 TDs. The one comfort: he just proved age 33 can still be WR8.`,[`age`,`reg`]],[`Bucky Irving`,`RB`,`TB`,54.6,`risk`,5,4,`'Chairman of a committee': success rate cratered to 41.6% (46th of 48) and Tampa gave him ZERO carries inside the 5 last year — Tucker owned them, and Gainwell was signed. Elite line keeps him afloat.`,[`comm`,`cap`]],[`Christian Watson`,`WR`,`GB`,57.5,`solid`,5,4,`Green Bay quietly traded away Doubs AND Wicks — someone has to catch the ball. Target-vacuum bet.`,[`bb`]],[`Tyler Warren`,`TE`,`IND`,62.1,`buy`,5,2,`817 yards as a rookie (a Colts TE record) plus a Pro Bowl nod, and Pittman's 100+ targets just left for Pittsburgh. Elite-TE volume at a round-6 price. Take him at cost.`,[`y2`,`brk`,`ceil`]],[`Carnell Tate`,`WR`,`TEN`,61.7,`solid`,5,4,`The safest rookie profile: instant WR1, elite capital, zero drops on 66 targets last year. Fresh flag: took a hard practice hit 8/17, evaluation pending — check status. Bottom-tier offense caps the ceiling.`,[`rk`,`floor`,`cap`]],[`TreVeyon Henderson`,`RB`,`NE`,57.4,`risk`,5,4,`Explosive (top-10 RB down the 2025 stretch), but the Patriots are now openly planning a 50-50 split — and his share is gated on pass-pro improvement. Price assumes a takeover nobody in the building is promising.`,[`comm`,`y2`,`bb`,`ceil`]],[`Jadarian Price`,`RB`,`SEA`,61.9,`risk`,5,4,`'Prime Dalvin Cook' burst (a teammate's actual quote) and back with the 1s — but the first depth chart briefly listed UDFA George Holani as starter during his soreness blip, and Charbonnet returns ~Wk 5-6. High-variance committee lead.`,[`comm`,`rk`,`bb`,`ceil`]],[`Brian Thomas Jr.`,`WR`,`JAX`,64,`solid`,5,4,`2025's headline bust — mostly QB chaos. Camp raves about a 'dominant offseason' and the Jags turned down multiple trade offers for him. Decent bounce-back odds at a two-round discount.`,[`bnc`,`bb`]],[`Parker Washington`,`WR`,`JAX`,58.7,`solid`,5,4,`Three-list consensus breakout (14+ PPG from Week 9 on) — and Hunter's shift to full-time CB hands his target share a tailwind. He or Thomas is the alpha; both are startable.`,[`brk`,`bb`]],[`Joe Burrow`,`QB`,`CIN`,68.4,`solid`,5,2,`Vegas favorite to lead the NFL in passing yards AND TDs. The best stack partner alive (Chase, Higgins).`,[`floor`,`ceil`]],[`Jayden Daniels`,`QB`,`WAS`,69.6,`solid`,5,2,`Rushing floor + a real WR duo now (McLaurin, Diggs). The wrinkle has a name: first-time play-caller David Blough, who wants more under-center work — camp says Daniels is 'accurate as he's ever been' in it.`,[`ceil`]],[`Marvin Harrison Jr.`,`WR`,`ARI`,67.1,`risk`,5,3,`The talent is not the question. An injury-wrecked 2025 (41-608-4 in 12 games), Vegas's bottom-2 offense and Brissett's low ceiling are. Bounce-back bet, not a proven WR1.`,[`bb`,`bnc`]],[`Jaylen Warren`,`RB`,`PIT`,70.4,`solid`,5,4,`Named camp RB1, but Dowdle is genuinely pushing to overtake him — McCarthy calls BOTH 'four-down backs.' Run-first offense keeps the pie big; the split is live.`,[`comm`,`cap`]],[`Rhamondre Stevenson`,`RB`,`NE`,71.1,`solid`,5,4,`His half of the now-official 50-50 committee comes with the early downs and short yardage, in the #2 scoring offense. Unsexy RB3 with RB2 weeks — and he's a round cheaper than Henderson.`,[`comm`,`floor`,`cap`]],[`Quentin Johnston`,`WR`,`LAC`,74.7,`solid`,5,4,`ADP up 31 spots this summer — McDaniel's scheme lifts the whole passing game. Momentum play.`,[`bb`]],[`DK Metcalf`,`WR`,`PIT`,75.8,`risk`,5,4,`Genuine analyst split: PFF calls him a top-3 coaching-change WINNER (McCarthy's offenses rank top-4 in deep shots), while others see Rodgers' quick game + Pittman capping him. Boom case is real; so is the WR3 floor.`,[`bb`]],[`Jalen Hurts`,`QB`,`PHI`,72.8,`solid`,5,3,`The rushing TDs always come. Note: the league's toughest Weeks 15-17 slate.`,[`floor`]],[`Caleb Williams`,`QB`,`CHI`,73.2,`buy`,5,3,`QB5 in year one under Ben Johnson, and camp says he's 'no longer drowning' — pre-snap mastered, designed runs being added. The year-2-in-scheme leap is the buy.`,[`ceil`,`brk`]],[`Tony Pollard`,`RB`,`TEN`,76.7,`solid`,5,4,`Boring volume on a bad team. The foot has now cost him back-to-back practices (8/16-17) — beats call it minor, but check status draft morning.`,[`bell`,`floor`,`cap`]],[`Tucker Kraft`,`TE`,`GB`,78.2,`solid`,5,3,`ACL rehab ahead of schedule ('looks spectacular'). His TD rate will cool, but the thinned-out GB target tree helps.`,[`rec`,`reg`]],[`Jayden Reed`,`WR`,`GB`,79.6,`solid`,5,4,`Doubs and Wicks are gone; Reed's slot role is the passing game's stable center.`,[`bb`]],[`Justin Herbert`,`QB`,`LAC`,83.7,`buy`,5,3,`McDaniel is explicitly speeding up his release behind a healthier line. The market prices last year's sacks, not this year's scheme.`,[`ceil`]],[`Dak Prescott`,`QB`,`DAL`,80.8,`solid`,5,3,`Led the NFL with 600 attempts; dome-heavy playoff slate. The QB half of the best playoff stack.`,[`floor`]],[`Josh Downs`,`WR`,`IND`,81.8,`buy`,5,4,`Projection models put him ~40 picks above this price as the Colts' top target-earner. Groin called 'not serious' by Steichen with a quick return expected — confirm he's practicing before you draft. Buy.`,[`brk`]],[`Courtland Sutton`,`WR`,`DEN`,83.5,`solid`,5,4,`Steady red-zone role in a rising offense — though Waddle's arrival caps the target share.`,[`floor`,`cap`]],[`Rico Dowdle`,`RB`,`PIT`,85.5,`solid`,5,5,`The short-yardage half — and actively pushing Warren for the lead job per camp reports. TD-dependent flex with a real takeover path.`,[`comm`,`cap`,`brk`]],[`Trevor Lawrence`,`QB`,`JAX`,86.5,`solid`,5,4,`Resurgent under Coen (QB4 last year). Fine QB1 if you punted.`,[`floor`]],[`Brock Purdy`,`QB`,`SF`,102,`buy`,6,4,`~20 PPG when healthy — top-3 rate — and nobody drafts him. 'When healthy' is the catch: 9 of 17 games last year. Cheap enough to pair with a floor QB2.`,[`floor`,`inj`]],[`Chris Godwin Jr.`,`WR`,`TB`,87.5,`solid`,6,5,`Re-signed, reliable slot floor in a good offense; ceiling belongs to Egbuka. On ESPN he goes ~68 picks later than experts rank him — the biggest freebie on that platform.`,[`floor`,`cap`]],[`Sam LaPorta`,`TE`,`DET`,88.5,`solid`,6,2,`Top-5 TE in a top-3 offense, priced round 8 because 2025 was 'only' good. Easy value if you punted TE.`,[`floor`]],[`Blake Corum`,`RB`,`LAR`,89.5,`solid`,6,5,`The #1 handcuff in fantasy — paced 900+ rushing yards over the last 10 games of 2025. Standalone flex value, league-winner if Kyren misses.`,[`comm`,`cuff`,`ceil`]],[`RJ Harvey`,`RB`,`DEN`,88,`risk`,6,5,`Explosive receiver, brutal runner: 3rd-worst rushing success rate and 4th-worst rush yards over expected last year — and Denver re-signed Dobbins and drafted Coleman anyway. PPR-week flex, not a breakout.`,[`comm`,`y2`,`reg`,`bb`]],[`Jordan Addison`,`WR`,`MIN`,90.1,`solid`,6,5,`TD-unlucky in 2025 and Kyler raises the boat — but a camp thumb injury is slowing the rapport-building. Solid WR4 with WR2 stretches.`,[`bnc`]],[`Jonathon Brooks`,`RB`,`CAR`,78.8,`risk`,6,5,`ADP up ~20 spots on health buzz — for 9 career carries and two ACL tears. Real explosiveness buzz, and he starts preseason G2 with Hubbard out — but Hubbard is still expected back Wk 1. Priced for the story.`,[`comm`,`inj`,`rec`]],[`Chuba Hubbard`,`RB`,`CAR`,95.1,`risk`,6,5,`Hamstring MRI, week-to-week, missed preseason G2 — Canales says 'very confident' for Wk 1. Check status draft morning; Brooks is breathing on his neck.`,[`bell`,`inj`]],[`J.K. Dobbins`,`RB`,`DEN`,96.4,`risk`,6,5,`Has never played a full season — though this camp's hamstring blip lasted exactly one day. The chart lists him RB1 ahead of Harvey. Great line, fragile bet.`,[`comm`,`inj`]],[`Patrick Mahomes`,`QB`,`KC`,97.3,`risk`,6,4,`Cleared and says the knee 'feels great' — but he's scaling back designed runs BY CHOICE to lean on Walker. The Konami floor that made him top-5 is gone either way. QB2 with a brand-name price.`,[`rec`,`cap`]],[`Kyle Monangai`,`RB`,`CHI`,98.6,`risk`,6,5,`Worse than first reported: Fowler says the hyperextended knee costs him the rest of camp ('multiple weeks') and Week 1 is genuinely in doubt. Was Ben Johnson's TD sneak; now a wait-and-see.`,[`comm`,`y2`,`cap`,`rec`]],[`Michael Pittman Jr.`,`WR`,`PIT`,99.3,`solid`,6,5,`Traded to Pittsburgh; steady possession role in a run-first offense.`,[`floor`,`cap`]],[`Stefon Diggs`,`WR`,`WAS`,100.9,`buy`,6,5,`Signed Aug 5 — the clear #2 opposite McLaurin with Daniels throwing. Biggest 7-day ADP riser in football (+33 spots) and slower platforms STILL lag. Move before your room catches up.`,[`bnc`]],[`Jordan Mason`,`RB`,`MIN`,103.1,`buy`,6,5,`Quietly winning Minnesota's backfield from an aging Aaron Jones (13.5 PPG as a 2025 fill-in). A starting RB in round 8-9.`,[`comm`,`brk`,`floor`]],[`Jaxson Dart`,`QB`,`NYG`,101.6,`solid`,6,4,`QB14 as a rookie on the strength of his legs (487 rush yds, 9 rush TDs); adds Likely and (eventually) Nabers. Small flag: several camp medical-tent visits. Fine late QB1.`,[`y2`,`ceil`]],[`Xavier Worthy`,`WR`,`KC`,105.1,`solid`,6,5,`Fallen to a WR4 price and the models still flag him — but the split is brutal: with Rice on the field he's averaged ~2.7 catches and ~8 PPG. Ceiling dart that mostly needs a Rice absence.`,[`ceil`,`bb`]],[`Matthew Golden`,`WR`,`GB`,104.9,`buy`,6,5,`Model-projected ~40 picks above price in a receiver room that just lost two starters.`,[`y2`,`brk`]],[`Bo Nix`,`QB`,`DEN`,107,`buy`,6,4,`QB7 two straight years, best O-line in football, they traded a 1st for Waddle — and he's priced QB14. Buy.`,[`floor`]],[`Jacory Croskey-Merritt`,`RB`,`WAS`,107.6,`buy`,6,5,`The best efficiency profile (4.6 YPC, 8 TDs as a 7th-round rookie) in a genuinely OPEN six-back competition — charts disagree on the order and he's missed recent practice time. Models still love the price (+22 vs ADP); it's a bet, not a lock.`,[`comm`,`brk`,`bb`]],[`Kyle Pitts Sr.`,`TE`,`ATL`,102.5,`risk`,6,3,`19.0 PPG without London on the field, 9.6 with him. London is healthy — price him accordingly.`,[`bb`,`cap`]],[`Harold Fannin Jr.`,`TE`,`CLE`,102.4,`risk`,6,4,`Small-sample 2025 magic meets an unresolved QB room (Watson vs. Sanders). Bull case: new HC Monken genuinely feeds TEs. You're paying for the encore, not a discount.`,[`y2`,`reg`]],[`Matthew Stafford`,`QB`,`LAR`,108.8,`risk`,6,4,`Reigning MVP, 46 TDs at 38 — base rates say ~30 this year. Fine QB2; on ESPN his ADP runs two rounds hotter, don't chase it.`,[`age`,`reg`]],[`Jared Goff`,`QB`,`DET`,110.7,`solid`,6,4,`Four straight 4,000-yard years; the Amon-Ra stack partner. Steady late QB1.`,[`floor`,`cap`]],[`Kyler Murray`,`QB`,`MIN`,113.5,`buy`,6,4,`Named the Vikings' starter Aug 11 with Jefferson, Addison and Hockenson attached — still priced QB18. The late-round QB steal of 2026.`,[`bnc`,`ceil`,`inj`]],[`George Kittle`,`TE`,`SF`,113.8,`risk`,6,3,`Racing an aggressive Achilles timeline to Week 1. If the discount holds, low-end TE1 with spike weeks; any setback = Weeks 2-3.`,[`rec`,`age`]],[`Rachaad White`,`RB`,`WAS`,114.4,`solid`,6,5,`Leads a genuinely open six-back battle on some charts — but Daniels' offenses target RBs at bottom-of-league rates (12.8-15.7%), so even the pass-catching floor is thinner than it looks. Don't pay for settled volume.`,[`comm`,`cap`,`bb`]],[`Khalil Shakir`,`WR`,`BUF`,130.9,`buy`,6,5,`Models put him ~57 picks above this price. Allen's most-trusted underneath target in a 26-point offense.`,[`floor`]],[`Wan'Dale Robinson`,`WR`,`TEN`,111.6,`solid`,6,5,`140 targets in 2025 (with NYG), now reunited with Daboll — whose offenses rank top-10 in slot targets — as Tennessee's volume piece. PPR-shaped, still fine in half.`,[`floor`,`cap`]],[`Jakobi Meyers`,`WR`,`JAX`,115.4,`solid`,6,5,`Dependable target-earner in a top-6 scoring offense from 2025.`,[`floor`,`cap`]],[`Makai Lemon`,`WR`,`PHI`,82.5,`risk`,6,6,`Round-1 pick with a real WR2 path — but this is his THIRD hamstring in 17 months, he's missed a week of camp, and the market is already correcting (-12 spots this week). Rd-12 dart, nothing more.`,[`rk`,`rec`,`bb`,`inj`]],[`Jordan Love`,`QB`,`GB`,116.3,`solid`,6,5,`Volatile but the receiver-room churn hurts. Matchup-play QB2.`,[`bb`]],[`Kenneth Gainwell`,`RB`,`TB`,109.5,`risk`,6,5,`The passing-down slice of a three-way committee; Mayfield red-zone stack appeal only.`,[`comm`,`cap`]],[`Isaiah Likely`,`TE`,`NYG`,125.7,`buy`,6,4,`Giants paid him $40M and he's been Dart's clear top read while Nabers ramps up. The best TE-punt target.`,[`brk`]],[`Tyler Shough`,`QB`,`NO`,125.5,`solid`,6,5,`18+ PPG down his rookie stretch; added Etienne and (when healthy) Tyson. Sneaky QB2 with starter upside.`,[`y2`,`brk`]],[`Malik Willis`,`QB`,`MIA`,134.8,`solid`,6,5,`The battle's over: 3yr/$67.5M, outplayed Ewers all camp, sealed it in the preseason opener. A 50+ rush-yds/game floor on a bad roster — streaming-QB gold.`,[`bb`,`brk`]],[`Baker Mayfield`,`QB`,`TB`,121.8,`solid`,6,5,`Elite line (Wirfs status worth a check), Egbuka stack — but Zac Robinson is his FIFTH OC in five years, the quiet continuity tax. Reliable late QB1-by-committee.`,[`floor`]],[`Jayden Higgins`,`WR`,`HOU`,121.2,`solid`,6,5,`Seized the clear #2 job opposite Nico — DeMeco flat-out: 'He's going to have a great year.' Big frame, real riser.`,[`y2`,`brk`]],[`Romeo Doubs`,`WR`,`NE`,118.3,`solid`,6,5,`Paid $68M to be the WR2 opposite A.J. Brown in the #2 scoring offense — a defined role, not a camp hope. Sneaky depth with Maye throwing.`,[`cap`,`floor`]],[`Michael Wilson`,`WR`,`ARI`,91.8,`solid`,6,5,`2025's waiver MVP stretch was real, but the Cardinals tax (bottom-2 offense, QB mess) applies to him too.`,[`bb`]],[`Dalton Kincaid`,`TE`,`BUF`,123.3,`risk`,6,4,`Best per-route TE in football on a tiny snap share. The bet is 'more usage' — experts say the market already over-bet it.`,[`bb`,`reg`,`inj`]],[`De'Zhaun Stribling`,`WR`,`SF`,126.4,`buy`,7,5,`7-63 in his debut (led the game, all first half) after the sharp money moved first (+64 spots in a week). SF's room is decimated: Pearsall out for the year, Aiyuk unresolved, Kirk hurt. Real snaps are coming.`,[`rk`,`brk`,`bb`]],[`Denzel Boston`,`WR`,`CLE`,140.3,`buy`,7,5,`The camp riser of the summer: promoted to first team while incumbent Jerry Jeudy visibly struggles. Shedeur-vs-Watson QB murk is the only drag. Basically free.`,[`rk`,`brk`]],[`Jake Ferguson`,`TE`,`DAL`,134,`solid`,7,4,`Dak's red-zone TE in the best playoff-schedule offense. Fine punt target.`,[`cap`]],[`Mark Andrews`,`TE`,`BAL`,130.8,`risk`,7,4,`Likely's exit helps, but experts have him among the most overdrafted TEs. Late only.`,[`age`,`cap`]],[`Zach Charbonnet`,`RB`,`SEA`,159.4,`buy`,7,6,`'The most proven handcuff in football' — but PUP rules mean a realistic Week 5-6 debut. Elite stash IF you can float the roster spot for a month.`,[`comm`,`cuff`,`rec`]],[`MarShawn Lloyd`,`RB`,`GB`,160.5,`buy`,7,6,`The Jacobs contingency plan. High-stakes sharps moved him up 19 spots in a week — they're pricing the suspension risk.`,[`comm`,`cuff`,`bb`]],[`Tyler Allgeier`,`RB`,`ARI`,148.1,`buy`,7,6,`Took the BULK of first-team camp reps even before Love's sprain, and starts if Love isn't right (high-ankle norms say he may not be). Free insurance with a real early-season role.`,[`comm`,`cuff`]],[`Alvin Kamara`,`RB`,`NO`,161.8,`solid`,7,6,`Sprained MCL Aug 19, out at least a month (Schefter) — Week 1 is gone at best. Restructured to stay, and camp confirms he keeps the passing downs outright (Etienne gets the carries). Half-PPR trims his edge; the floor is real.`,[`comm`,`age`,`cap`]],[`Woody Marks`,`RB`,`HOU`,141.6,`buy`,7,6,`Not just insurance: DeMeco is explicitly building the Lions' Gibbs/Monty tandem with Marks in the Gibbs role. 5 TDs on 7.8 expected says positive regression too. Deep-league gold.`,[`comm`,`y2`,`bnc`]],[`Rashid Shaheed`,`WR`,`SEA`,133.8,`solid`,7,6,`Seattle's field-stretcher; JSN's gravity leaves him single coverage.`,[`bb`]],[`Deebo Samuel Sr.`,`WR`,`SF`,128,`risk`,7,6,`Healthy and 'explosive, lean' per camp, and Pearsall's season-ending injury feeds him targets — sharps moved him up 35-50 spots. But four straight years of hot-start-then-hurt is still the profile.`,[`inj`,`age`]],[`Dallas Goedert`,`TE`,`PHI`,135.1,`avoid`,7,5,`11 TDs on 60 catches (5.1 expected) — statistically extreme, and the market agrees: he went unsigned into free agency before a $7M one-year deal. Projections say TE20.`,[`age`,`reg`]],[`Sam Darnold`,`QB`,`SEA`,142.2,`solid`,7,5,`Super Bowl-winning continuity; fine streamer with a champion's schedule.`,[`floor`]],[`Daniel Jones`,`QB`,`IND`,146.8,`solid`,7,5,`Locked-in starter and the camp's been clean — though national reporting (8/17) questions whether the pre-Achilles wheels are all the way back, which caps the rushing floor. Stabilizes the Colts.`,[`rec`,`floor`]],[`C.J. Stroud`,`QB`,`HOU`,145.5,`solid`,7,5,`Improved AFC South schedule; O-line still the anchor dragging him down.`,[`cap`]],[`T.J. Hockenson`,`TE`,`MIN`,170.3,`solid`,7,4,`The Kyler lift is the theory; early usage is thin (5 snaps in the preseason opener). Free TE with spike weeks if the targets come — streamer until they do.`,[`bnc`,`cap`]],[`Oronde Gadsden II`,`TE`,`LAC`,167.5,`solid`,7,4,`McDaniel schemes touches to TEs — but the trade for David Njoku (a camp standout) splits that pie three ways. Deep-league punt, watch the usage.`,[`y2`,`brk`,`cap`]],[`Travis Kelce`,`TE`,`KC`,122.7,`avoid`,7,4,`Turns 37 with yards-per-target down four straight years (6.9 the last two vs 8.6 career), and Rice + Walker eat his targets. The name costs three rounds more than the player.`,[`age`,`reg`]],[`Isiah Pacheco`,`RB`,`DET`,168.9,`solid`,7,6,`Signed with Detroit — the direct Gibbs handcuff in the league's best RB environment. Back and knee injuries have him up in the air for Week 1 (Colton Pouncy, The Athletic).`,[`comm`,`cuff`]],[`Tyrone Tracy Jr.`,`RB`,`NYG`,136.6,`solid`,7,6,`Trending toward the change-of-pace/passing-down half after Skattebo got the preseason start — still the direct insurance in a run-heavy scheme.`,[`comm`,`cuff`]],[`Tank Bigsby`,`RB`,`PHI`,151.1,`solid`,7,6,`The direct Saquon handcuff behind the league's best line — and Philly is openly using him to MANAGE Saquon's workload, so there's standalone touch value too. Zero-RB stash.`,[`comm`,`cuff`,`bb`]],[`Tyjae Spears`,`RB`,`TEN`,157.9,`solid`,7,6,`Pollard insurance with standalone passing-down work.`,[`comm`,`cuff`]],[`Keaton Mitchell`,`RB`,`LAC`,130.8,`risk`,7,6,`Explosive space player McDaniel could scheme for — but he was a healthy inactive in the preseason opener while Vidal played. The RB2 job is unresolved. Boom-or-bench.`,[`comm`,`bb`]],[`Jalen Coker`,`WR`,`CAR`,129.4,`risk`,7,6,`Carolina paid him $35M, but the 2025 sample was 33 catches in 11 games and Legette is real competition. Upside dart, not established volume.`,[`brk`,`bb`]],[`Dontayvion Wicks`,`WR`,`PHI`,166.3,`solid`,7,6,`Fowler says the org is 'really excited' — and his WR2 competition (a scuffling Hollywood Brown) is beatable. Cheap route to real snaps in a thin room.`,[`bb`,`brk`]],[`Zachariah Branch`,`WR`,`ATL`,184.4,`buy`,7,6,`50-yard TD in his first padded practice and the story of Falcons camp — though the slot's 1st-team reps still run through Zaccheaus. Path to WR2 for free; not there yet.`,[`rk`,`brk`]],[`Jordyn Tyson`,`WR`,`NO`,69.1,`risk`,7,6,`Elite rookie profile, clear #2 role — but Rapoport says the new hamstring costs him ~2 months (mid-late October). The best-ball ADP is stale by a mile; rd-14 stash or waiver add.`,[`rk`,`rec`]],[`Omar Cooper Jr.`,`WR`,`NYJ`,155.5,`risk`,7,6,`Fading: camp 'pitfalls' per his own WR coach, and Adonai Mitchell has the #2 job behind Wilson. Round-1 pedigree, last-round flier only.`,[`rk`,`bb`]],[`Travis Hunter`,`WR`,`JAX`,148.9,`risk`,7,5,`Trending the wrong way for fantasy: listed at starting CB and SECOND-string WR, with defensive reps climbing all camp (final commitment withheld until it counts). Talent's real; the WR snaps may not be.`,[`y2`,`cap`]],[`Keon Coleman`,`WR`,`BUF`,210,`solid`,7,6,`Has functionally locked the WR3 job (camp buzz + a preseason TD) in 73,125]},x=[{when:`Aug 31, 2026 · 11:45 AM PT`,items:[{player:`Josh Jacobs`,dir:`down`,text:`Placed on the COMMISSIONER'S EXEMPT LIST (Adam Schefter, ESPN) — cannot play or practice until the league acts, no end date, paid in the meantime. Formally charged with two misdemeanors; first court appearance Nov 17 (Rob Demovsky, ESPN). Sleeper now lists him O; his ADP has already slid 28.5 → 34.6 and 42,000 leagues dropped him in a day.`},{player:`MarShawn Lloyd`,dir:`up`,text:`"Poised to begin the season as Green Bay's lead running back" (Matt Schneidman, The Athletic). The market repriced him over the weekend exactly as the handcuff model said it would: ADP 179 → 136, 449,000 adds in 24 hours. His flag now reads +2.3 pts/wk from Jacobs' risk.`},{player:`Jordyn Tyson`,dir:`down`,text:`Officially to injured reserve (Matthew Paras) — out at least the first four games on top of the two-month hamstring timeline. ADP 92 → 104 and falling.`},{player:`Zach Charbonnet`,dir:`down`,text:`Opens the season on PUP (Adam Schefter, ESPN) — out at least four games, formalising the Wk 5–6 return the board already assumed.`},{player:`Ashton Jeanty`,dir:`up`,text:`Avoids injured reserve (Sam Warren, The Athletic) and the Raiders are "counting on" him for the opener (Levi Edwards).`},{player:`Puka Nacua`,dir:`up`,text:`Back at practice Sunday (Sarah Barshop, ESPN), and expected to AVOID the commissioner's exempt list on the conduct case (Tom Pelissero, NFL Network).`},{player:`Xavier Worthy`,dir:`up`,text:`Cleared — no longer Questionable. Same for Quentin Johnston.`},{player:`Jaydon Blue`,dir:`down`,text:`Waived by the Cowboys (Adam Schefter, ESPN) and zeroed out of Sleeper's projections — off the board.`},{text:`The exempt-list wire items carry no keyword tag — the tagger has no rule for it — but nothing was missed: Sleeper's O designation carries the risk (Jacobs pMiss 0.67), which is the designed channel. A tag never moves a projection; a designation does.`},{text:`Every study regenerated on the post-weekend market. Seat 2 wins 39%: Bijan is there 87% and Gibbs falls only 15% — the room re-firmed on Gibbs first overall. Head-to-head: Brian 111.4 pts/wk (best team 39%), Ashley 109.5 (35%), Emily 105.2 (26%). Biggest value falls on Sleeper right now: Purdy +40 picks vs our rank, Goff +36, Josh Downs +34.`}]},{when:`Aug 27, 2026 · 1:00 PM PT`,items:[{player:`Ja'Marr Chase`,dir:`down`,text:`Banged his left knee Tuesday and sat Wednesday's practice — no brace, no timeline (Ben Baby, ESPN). Sleeper lists him Q. At 3.7 he is the first player on the board carrying a live question mark.`},{player:`Jahmyr Gibbs`,dir:`up`,text:`Sleeper ADP has slipped 1.1 → 1.9 while Bijan firmed 2.7 → 2.4. He now reaches pick 2 about 27% of the time, up from 5% on Aug 24 — and when he does he is the priority, +5.4 pts/wk over the field in the RB-LOSS room. Bijan is there 73%.`},{player:`Ashton Jeanty`,dir:`down`,text:`Low-ankle sprain — not believed serious, but uncertain for Week 1 (Ian Rapoport). Kubiak will only say "on the mend". Still Q at 11.3.`},{player:`Josh Jacobs`,dir:`down`,text:`The Packers are preparing for a suspension (Matt Schneidman, The Athletic), and the groin only allowed limited work as of Monday. The room still pays 29.5 for him.`},{player:`Isiah Pacheco`,dir:`down`,text:`Back and knee — up in the air for Week 1 (Colton Pouncy, The Athletic). He is the Gibbs handcuff, so this is a late-round question, not a Week 1 one.`},{player:`Alvin Kamara`,dir:`down`,text:`Still a month out (Schefter). Our model had quietly shortened that to one week after a newer Kendre Miller quote with no number in it arrived and outranked the report that had one — fixed; the month stands.`},{player:`Malik Nabers`,dir:`up`,text:`Out of the non-contact jersey and into 11-on-11 (Connor Hughes); Harbaugh says it is reasonable to assume he is ready for Week 1. Wednesday's early exit was not injury-related (Dan Duggan, The Athletic).`},{player:`Alec Pierce`,dir:`up`,text:`PUP → Questionable, expected back at practice this week (Stephen Holder, ESPN). That lifts his projection in the sim enough that it now prefers him to Jayden Reed at seat 1's round 6 — the board still says believe it when he practices.`},{player:`Tucker Kraft`,dir:`up`,text:`Expected full-go for Week 1, no snap count (Rob Demovsky, ESPN).`},{player:`Kenyon Sadiq`,dir:`down`,text:`Jets will scale back his role early after the hernia surgery (Zack Rosenblatt, The Athletic). Sleeper cut his projection 2.0 pts/wk on the same day.`},{player:`Mike Evans`,dir:`up`,text:`Groin considered minor; plans to play Week 1 (Jeremy Fowler, ESPN).`},{player:`Kenneth Walker III`,dir:`down`,text:`Sleeper lists him Questionable with a foot injury. Nothing sourced on it yet — no reporter, no timeline — so it shows as a knock, not a projected absence.`},{player:`MarShawn Lloyd`,dir:`up`,text:`Handcuffs are now priced for their starter's risk, measured rather than guessed: across 41 weeks in 2025 in which a starter sat, his backup scored 0.65 of the starter's own pts/wk more than usual (scripts/sim-cuffvalue.mjs). Lloyd carries +1.5 pts/wk from Jacobs' risk and reads 5.4, not 3.9; Pacheco +1.6, Brian Robinson +1.5, Allgeier +1.4, Bigsby +1.3. It applies to every seat, not just the starter's owner. A suspension with no reported length is not in Jacobs' risk, so this is the injury-and-verdict share only.`},{text:`Injury flags 37 → 42. New Q: Ja'Marr Chase, Kenneth Walker III, Zay Flowers (precautionary — ready for Week 1 per HC Minter, via Jonas Shaffer), Brian Thomas Jr., Josh Downs (calf, "very minor"), Wan'Dale Robinson (concussion evaluation — Turron Davenport, ESPN), Keaton Mitchell (setback).`},{text:`Sleeper republished its projections again. Quarterbacks up across the board — Kyler Murray +2.1, Burrow +2.0, Hurts +1.8, Purdy +1.6, Lamar +1.5, Mahomes +0.9 — plus McCaffrey +1.5 and Kittle +1.1. Down: Makai Lemon −2.2, Oronde Gadsden −2.1, Kenyon Sadiq −2.0, Luther Burden −1.2, Chuba Hubbard −1.2.`},{text:`Every study on the Simulations tab regenerated on today's numbers for seats 1, 2 and 10. Win rates read higher than Aug 24 — seat 2 is 43%, was 35% — and most of that is not the data. The Aug 24 numbers predate the opponent-model fix from later that day (no more four-quarterback rosters keeping backs on the board). Today's data alone moves seat 2 from 35% to 37%; the corrected room takes it to 43%. Head-to-head with all three sharp seats in one room: Brian 111.3 pts/wk (best team 40%), Ashley 109.4 (35%), Emily 104.2 (25%).`},{text:`Two more bugs caught in this pass. The seat head-to-head study still had Brian at pick 6 and had been crashing the pre-draft script since he moved to 2 — the Aug 24 run never got past its first study. And a rest note ("holding him out of Saturday's game") tagged Trey McBride as a contract holdout. Both fixed. With handcuffs priced, the two round-6 disagreements between advisor and simulation (Pierce/Reed, Watson/Warren) closed on their own; one new one opened at seat 1's round 3, where the sim prefers Jeremiyah Love to George Pickens by 1.17 pts/wk with Love still Q on the high-ankle sprain. Left standing rather than tuned away.`}]},{when:`Aug 24, 2026 · 11:00 AM PT`,items:[{player:`Ashton Jeanty`,dir:`down`,text:`Now listed Questionable. Watch this one — he is priced at 11.3 and a Q tag six days out is not nothing.`},{player:`George Kittle`,dir:`up`,text:`Upgraded PUP → Questionable, and Schefter has him ahead of schedule with a chance at Week 1. Our board briefly had him out for the year on a mis-read of his January surgery; that is fixed.`},{player:`TreVeyon Henderson`,dir:`down`,text:`Questionable.`},{player:`Jacory Croskey-Merritt`,dir:`down`,text:`Questionable.`},{player:`DeVonta Smith`,dir:`up`,text:`Cleared — no longer Questionable. Same for DJ Moore and Carnell Tate.`},{player:`Jahmyr Gibbs`,dir:`down`,text:`Reaches pick 2 only 5% of the time now, down from 11% — the market has firmed on him going first overall. Bijan Robinson is there 95%.`},{text:`Brian drafts from pick 2. Every study on the Simulations tab — priority order, RB-LOSS shapes, draft tree, plans, risk dial — regenerated on today's numbers for seats 1, 2 and 10.`},{text:`Two bugs caught in the pre-draft pass. A retrospective mention of January surgery was reading as a current season-ending injury; month names now count as historical. And a seat-name argument losing its quotes made two regenerations run zero seats while reporting success — they now fail loudly instead.`}]},{when:`Aug 20, 2026 · 2:15 PM PT`,items:[{player:`Jayden Higgins`,dir:`down`,text:`Sleeper has now zeroed his projection outright — he is off the board, not just flagged. Torn ACL, out for the year.`},{player:`Tyler Warren`,dir:`down`,text:`Groin, about a week (Ian Rapoport). Week 1 against the Ravens is explicitly not in danger — a dip to buy, not a reason to pass.`},{player:`Patrick Mahomes`,dir:`up`,text:`Sleeper republished its projections and moved him +1.95 pts/wk, the largest jump on the board.`},{player:`Aaron Rodgers`,dir:`up`,text:`+1.57 pts/wk on the same republish; Tyler Shough +1.24 and Brock Purdy +1.01.`},{player:`Alvin Kamara`,dir:`down`,text:`Still a month out with the MCL sprain (Adam Schefter) — unchanged, but now his projection has ticked up, so the price may not reflect it.`},{player:`Carnell Tate`,dir:`down`,text:`ADP slipping, 62.5 → 65.9 over the last day.`},{text:`Projections are NOT frozen — correcting what this log said yesterday. They republish in batches, seemingly after preseason games, and sit flat in between. Two days of no movement was a gap between updates, not a standing fact.`},{text:`Four wire-tagging bugs fixed: "expected to miss about a week" was being read as three weeks; a story about a player RETURNING was filed as an absence; a ranking blurb speculating about a timeshare was tagged as a reported committee; and Ian Rapoport was credited to ESPN.`}]},{when:`Aug 19, 2026 · 3:30 PM PT`,items:[{player:`Jayden 87788448,s:`rotowire`,h:`Mike Evans - Groin injury considered minor`,d:`Mike Evans - Groin injury considered minor.`,a:`Jeremy Fowler, ESPN`,g:`hurt`},{t:1787774417,s:`rotoballer`,h:`Mike Evans Plans to Play in Week 1 Despite Being Banged Up in Camp`,d:`San Francisco 49ers veteran wide receiver Mike Evans (groin) plans to play in Week 1 in Australia against the division-rival Los Angeles Rams despite dealing with injuries in training camp this summer, a source told Jeremy Fowler of ESPN.`,a:`Jeremy Fowler, ESPN`,g:`hurt`},{t:1787681424,s:`rotowire`,h:`Mike Evans - Sitting with groin injury`,d:`Mike Evans - Sitting with groin injury.`,a:`Matt Maiocco, NBC Sports`,g:`hurt`}],"Travis Kelce":[{t:1786588675,s:`rotowire`,h:`Travis Kelce - Looking to bounce back in 2026`,d:`Kelce said Wednesday that he wants to "prove to myself that I can play at a better level than I did last year" this upcoming season, Nate Taylor of ESPN.com reports.`,a:`Nate Taylor, ESPN`},{t:1786560427,s:`rotoballer`,h:`Travis Kelce Says he Can Still "Play at a High Level"`,d:`In what could be his final NFL season in 2026, Kansas City Chiefs tight end Travis Kelce thinks he can still "play at a high level," according to Nate Taylor of ESPN. "I've still got a lot of love for this game," Kelce said Wednesday. "I want to go out there a`,a:`Nate Taylor, ESPN`},{t:1786541827,s:`rotoballer`,h:`Kenneth Walker Called an "Absolute Superstar"`,d:`According to Charles Goldman, Travis Kelce said Walker is "going to be a hell of a ball player for us," praised his all-around traits, and called him an "absolute superstar" on and off the field.`,a:`direct quote`,g:`hype`}],"Aaron Rodgers":[{t:1787869321,s:`rotowire`,h:`Aaron Rodgers - Won't play Thursday`,d:`Rodgers isn't in uniform for Thursday's preseason contest at Buffalo, Alan Saunders of SteelersNow.com reports.`,a:`Alan Saunders, SteelersNow.com`},{t:1787855645,s:`rotoballer`,h:`Aaron Rodgers Not Playing in Preseason Finale`,d:`Pittsburgh Steelers veteran quarterback Aaron Rodgers is not dressed for warmups and will not play in the team's preseason finale on Thursday evening against the Buffalo Bills, according to Alan Saunders of PGH Steelers Now. Rodgers will end up sitting out all`,a:`Alan Saunders`},{t:1787151113,s:`rotowire`,h:`Aaron Rodgers - Won't play in second preseason game`,d:`Steelers head coach Mike McCarthy said that Rodgers will be rested for Friday's preseason game against the Jets, Chris Adamski of TribLive.com reports.`,a:`Chris Adamski, TribLive.com`}],"Davante Adams":[{t:1787662474,s:`rotoballer`,h:`Davante Adams Looks "Fresh and Explosive"`,d:`The Athletic's Nate Atkins writes that there was some concern over whether Los Angeles Rams wide receiver Davante Adams could still be a perimeter receiver at 33 years old, but he has looked "fresh and explosive" in training camp and was "virtually uncoverable`,a:`Nate Atkins`},{t:1786662605,s:`rotoballer`,h:`Davante Adams Could be in Line for Early-Season Explosion`,d:`Los Angeles Rams wide receiver Davante Adams could see a heavy workload in the first few games of the season. In his first season with the Rams in 2025, Adams recorded 789 yards and 14 touchdowns in 14 games, finishing as the WR8 in half-PPR formats. ESPN's Ad`,a:`Adam Schefter, ESPN`},{t:1785531785,s:`rotoballer`,h:`Davante Adams Uncertain About Future After 2026 Season`,d:`Los Angeles Rams wide receiver Davante Adams is unsure whether 2026 will be his final NFL season or if he'll continue to play. The 13th-year receiver said this week that, "I've given (retirement) some thought. Right now, I'm just enjoying it. I can't tell you `,a:`direct quote`}],"Christian McCaffrey":[{t:1787519708,s:`rotoballer`,h:`Christian McCaffrey's Absence Part of the Plan`,d:`" The Niners have been holding out their star RB late with undisclosed tightness, but he returned to practice on Sunday and even jumped into team drills.`,a:`Nick Wagoner, ESPN`,g:`back`},{t:1787518037,s:`rotowire`,h:`Christian McCaffrey - Downplays preseason absence`,d:`McCaffrey (undisclosed) said Sunday that he always planned to take a break during training camp and then "ramp back up," Vic Tafur of The Athletic reports.`,a:`Vic Tafur, The Athletic`},{t:1787511798,s:`rotowire`,h:`Christian McCaffrey - Jumps into team drills Sunday`,d:`Updating a previous report, McCaffrey (undisclosed) participated in team drills during Sunday's practice, Vic Tafur of The Athletic reports.`,a:`Vic Tafur, The Athletic`}],"Stefon Diggs":[{t:1787407984,s:`rotowire`,h:`Stefon Diggs - Will make preseason debut`,d:`Diggs is expected to make his preseason debut Saturday against Detroit, Ian Rapoport of NFL Network reports.`,a:`Ian Rapoport, NFL Network`},{t:1787395507,s:`rotoballer`,h:`Jayden Daniels, Terry McLaurin, and Stefon Diggs Expected to Play Saturday`,d:`The Washington Commanders have listed 15 players who will not participate in Saturday's preseason matchup with the Lions, but NFL Insider Adam Schefter notes that among the starters expected to see action are quarterback Jayden Daniels and wide receivers Terry`,a:`Adam Schefter, ESPN`},{t:1786730826,s:`rotoballer`,h:`Stefon Diggs Won't Make Debut With Commanders on Friday`,d:`The Athletic's Ben Standig reports that Washington Commanders wide receiver Stefon Diggs will not suit up for Friday's preseason opener against the Miami Dolphins. Fellow wideout Terry McLaurin will also be on the sideline as the Commanders rest most of their `,a:`Ben Standig`}],"David Njoku":[{t:1785754146,s:`rotoballer`,h:`David Njoku Helping to Unlock Chargers Offense`,d:`The Los Angeles Chargers' new-look offense is thriving in the early days of training camp, and one of the reasons, as pointed out by Sports Illustrated's Albert Breer, is the addition of tight end David Njoku and the improvements made to the position as a whol`,a:`Sports Illustrated, Albert Breer`}],"Derrick Henry":[{t:1786495051,s:`rotowire`,h:`Derrick Henry - Expected to maintain workload`,d:`Henry is expected to get his normal workload this season but will also be more involved in the passing game, Jeremy Fowler of ESPN.com reports.`,a:`Jeremy Fowler, ESPN`}],"Dak Prescott":[{t:1785770765,s:`rotoballer`,h:`Dak Prescott Won't Play in Preseason`,d:`Dallas Cowboys quarterback Dak Prescott will sit out the preseason after head coach Brian Schottenheimer said the team does not plan to play its starters, according to Nick Harris. Prescott has not appeared in an exhibition game since 2019, so this continues D`,a:`Nick Harris`}],"Cooper Kupp":[{t:1783361402,s:`rotowire`,h:`Cooper Kupp - Back for Year 2 with Seattle`,d:`As the coming season approaches, Kupp is line to reprise a key role in a Seahawks wide receiver corps led by reigning Offensive Player of the Year Jaxon Smith-Njigba, Justin Melo of USA Today reports.`,a:`Justin Melo, USA Today`}],"George Kittle":[{t:1788101861,s:`rotowire`,h:`George Kittle - Expected to practice this week`,d:`Kittle (Achilles) is expected to practice this week as he continues his push to play in the 49ers' season opener against the Rams in Australia, Adam Schefter of ESPN reports.`,a:`Adam Schefter, ESPN`},{t:1788090968,s:`rotoballer`,h:`George Kittle Expected to Practice This Week`,d:`Kittle is still working his way back from an Achilles tendon injury that happened on January 11.`,a:`Adam Schefter, ESPN`,g:`hurt`},{t:1788083348,s:`rotoballer`,h:`Has George Kittle "Taken a Step Back"?`,d:`" He was not asked for further clarification, but with Kittle having been activated from the active/physically unable to perform list on August 23rd, it's possible Shanahan meant a step toward playing.`,a:`Mike Florio, Pro Football Talk`,g:`back`}],"Saquon Barkley":[{t:1787242630,s:`rotoballer`,h:`Saquon Barkley Standing Out in New-Look Eagles Offense`,d:`Philadelphia Eagles running back Saquon Barkley "consistently found running room within (new Eagles offensive coordinator Sean Mannion's) wide zone concepts" during the team's joint practice session with the New England Pat  to jump a level. Bust = expensive player about to disappoint.`],[`Floor / ceiling`,`Floor = his realistic bad outcome; ceiling = his realistic great one. "High floor" = safe. "High ceiling" = can win you the league. Boom-bust = huge weeks AND dud weeks.`],[`Red zone / goal line`,`Inside the opponent's 20-yard line / 5-yard line. Whoever gets the ball there scores the TDs — it's where fantasy points concentrate.`],[`Game script`,`How a game's score shapes play-calling: teams ahead run (good for RBs), teams behind throw (good for WRs). Vegas lines predict it.`],[`Implied team total`,`How many points Vegas expects a team to score in a game (or per game). More team points = more TDs to go around for your players.`],[`Stack`,`Drafting a QB plus his own receiver — when they connect for a TD, you get paid twice.`],[`Streaming`,`Not committing to one K/DST/QB — instead grabbing whoever has the best matchup each week off waivers.`],[`Waiver wire`,`The pool of undrafted players you can add during the season. Where leagues are won in September.`],[`Bye week`,`Each NFL team's one off-week. Your player scores zero that week — don't draft five starters with the same bye.`],[`Snap / opportunity share`,`Percent of the team's plays a player is on the field for, and the percent of the backfield's carries+targets he gets. Usage = opportunity = points.`],[`PPG`,`Fantasy points per game — the fairest way to compare players who missed time.`],[`IR slot`,`A bonus bench spot only for players officially out injured — lets you stash a hurt player (like Jordyn Tyson) without burning a real bench spot.`],[`Alpha / WR1`,`"Alpha" = the clear No. 1 receiver on his own team. "Fantasy WR1" = a top-12 receiver in fantasy scoring. A team alpha isn't always a fantasy WR1.`]];function Re({noob:e}){return(0,M.jsxs)(`div`,{className:`flex flex-col gap-5`,children:[(0,M.jsx)(F,{eyebrow:`The one-minute version`,title:`It's a running back year. Leave the first three rounds with two of them.`,children:`This
